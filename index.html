function tagEditor(kind, label, tags) {
  return `
    <div style="margin-bottom:12px;">
      <div class="muted" style="font-size:12px;margin-bottom:6px;">${label}</div>
      <div class="chips" style="margin-bottom:6px;">
        ${tags.map(t => `<span class="chip">${escapeHtml(t)}<span class="chip-remove" data-tag-del="${kind}|${escapeHtml(t)}">×</span></span>`).join('')}
      </div>
      <div style="display:flex;gap:6px;">
        <input type="text" data-tag-input="${kind}" placeholder="Add a ${label.toLowerCase().slice(0, -1)}…" style="flex:1;"/>
        <button class="btn btn-sm" data-tag-add="${kind}">Add</button>
      </div>
    </div>`;
}

function wireSettings() {
  // Accounts
  document.querySelector('[data-action="new-account"]').addEventListener('click', () => openAccountForm());
  document.querySelectorAll('[data-edit-acc]').forEach(b => b.addEventListener('click', () => openAccountForm(b.dataset.editAcc)));
  document.querySelectorAll('[data-del-acc]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.delAcc;
    const acc = Store.get().accounts.find(a => a.id === id);
    const tradeCount = Store.get().trades.filter(t => t.accountId === id).length;
    confirmModal({
      title: 'Delete account?',
      message: `${acc.name} has ${tradeCount} trade${tradeCount === 1 ? '' : 's'}. Deleting the account will also delete those trades.`,
      confirmText: 'Delete', danger: true,
      onConfirm: () => {
        Store.set(st => {
          st.accounts = st.accounts.filter(a => a.id !== id);
          st.trades = st.trades.filter(t => t.accountId !== id);
        });
        viewSettings(); rerender();
      }
    });
  }));

  // Preferences
  document.querySelectorAll('[data-pref]').forEach(el => el.addEventListener('change', () => {
    Store.set(st => {
      const v = el.dataset.pref === 'decimals' ? parseInt(el.value, 10) : el.value;
      st.meta[el.dataset.pref] = v;
    });
    rerender();
  }));

  // Custom tags
  document.querySelectorAll('[data-tag-add]').forEach(b => b.addEventListener('click', () => {
    const kind = b.dataset.tagAdd;
    const inp = document.querySelector(`[data-tag-input="${kind}"]`);
    const v = inp.value.trim();
    if (!v) return;
    Store.set(st => { if (!st.customTags[kind].includes(v)) st.customTags[kind].push(v); });
    viewSettings();
  }));
  document.querySelectorAll('[data-tag-del]').forEach(el => el.addEventListener('click', () => {
    const [kind, tag] = el.dataset.tagDel.split('|');
    Store.set(st => { st.customTags[kind] = st.customTags[kind].filter(t => t !== tag); });
    viewSettings();
  }));

  // Checklist
  document.querySelectorAll('[data-cl-enabled]').forEach(c => c.addEventListener('change', () => {
    Store.set(st => { st.checklist.items.find(i => i.id === c.dataset.clEnabled).enabled = c.checked; });
  }));
  document.querySelectorAll('[data-cl-del]').forEach(b => b.addEventListener('click', () => {
    Store.set(st => { st.checklist.items = st.checklist.items.filter(i => i.id !== b.dataset.clDel); });
    viewSettings();
  }));
  document.querySelector('[data-action="cl-add"]').addEventListener('click', () => {
    const inp = document.querySelector('[data-cl-new]');
    const v = inp.value.trim();
    if (!v) return;
    Store.set(st => { st.checklist.items.push({ id: uid(), text: v, enabled: true }); });
    viewSettings();
  });
  document.querySelector('[data-cl-required]').addEventListener('change', e => {
    Store.set(st => { st.checklist.required = e.target.checked; });
  });

  // Goals
  document.querySelectorAll('[data-goal]').forEach(el => el.addEventListener('change', () => {
    Store.set(st => { st.goals[el.dataset.goal] = el.value ? parseFloat(el.value) : null; });
  }));
  document.querySelectorAll('[data-milestone]').forEach(el => el.addEventListener('change', () => {
    const i = parseInt(el.dataset.milestone, 10);
    const k = el.dataset.key;
    Store.set(st => {
      st.goals.milestones[i] = st.goals.milestones[i] || { label: '', value: 0 };
      st.goals.milestones[i][k] = k === 'value' ? parseFloat(el.value) : el.value;
    });
  }));
  document.querySelectorAll('[data-milestone-del]').forEach(b => b.addEventListener('click', () => {
    Store.set(st => { st.goals.milestones.splice(parseInt(b.dataset.milestoneDel, 10), 1); });
    viewSettings();
  }));
  document.querySelector('[data-action="add-milestone"]').addEventListener('click', () => {
    Store.set(st => { st.goals.milestones = st.goals.milestones || []; st.goals.milestones.push({ label: '', value: 0 }); });
    viewSettings();
  });

  // Backup
  document.querySelector('[data-action="export"]').addEventListener('click', () => {
    Store.exportJSON();
    toast('Backup downloaded', 'success');
    viewSettings();
  });
  document.querySelector('[data-action="import"]').addEventListener('click', () => document.querySelector('[data-import-file]').click());
  document.querySelector('[data-import-file]').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      confirmModal({
        title: 'Replace all data?',
        message: 'Importing will overwrite every trade, account, and setting in this browser.',
        confirmText: 'Replace', danger: true,
        onConfirm: () => {
          const ok = Store.importJSON(ev.target.result);
          if (ok) { toast('Backup restored', 'success'); rerender(); }
          else toast('Invalid backup file', 'error');
        }
      });
    };
    reader.readAsText(file);
  });

  // Reset
  document.querySelector('[data-action="reset"]').addEventListener('click', () => {
    modal({
      title: 'Reset all data', size: 'modal-sm',
      body: `<p style="margin:0 0 12px;color:var(--text-dim);">This permanently deletes everything. Type <strong>DELETE</strong> below to confirm.</p>
        <input type="text" data-reset-confirm placeholder="DELETE"/>`,
      footer: `<button class="btn" data-close>Cancel</button><button class="btn btn-danger" data-do-reset disabled>Reset</button>`,
      onMount(overlay, close) {
        const inp = overlay.querySelector('[data-reset-confirm]');
        const btn = overlay.querySelector('[data-do-reset]');
        inp.addEventListener('input', () => { btn.disabled = inp.value !== 'DELETE'; });
        btn.addEventListener('click', () => {
          Store.reset(); close(); toast('All data wiped', 'success'); Router.nav('#/dashboard'); rerender();
        });
      }
    });
  });
}

function openAccountForm(id = null) {
  const s = Store.get();
  const editing = id ? s.accounts.find(a => a.id === id) : null;
  const a = editing || { name: '', type: 'Broker', startingCapital: 0, defaultFeeType: 'flat', defaultFeeValue: 0, notes: '' };
  const body = `
    <form id="acc-form">
      <div class="form-grid">
        <div class="field field-full"><label>Name</label><input name="name" required value="${escapeHtml(a.name)}"/></div>
        <div class="field"><label>Type</label>
          <select name="type">${['Broker','Crypto Exchange','Wallet','Bank'].map(x => `<option ${x === a.type ? 'selected' : ''}>${x}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Starting capital</label><input type="number" step="any" name="startingCapital" value="${a.startingCapital || ''}"/></div>
        <div class="field"><label>Default fee type</label>
          <select name="defaultFeeType"><option value="flat" ${a.defaultFeeType === 'flat' ? 'selected' : ''}>Flat amount</option><option value="pct" ${a.defaultFeeType === 'pct' ? 'selected' : ''}>Percent</option></select>
        </div>
        <div class="field"><label>Default fee value</label><input type="number" step="any" name="defaultFeeValue" value="${a.defaultFeeValue || 0}"/></div>
        <div class="field field-full"><label>Notes</label><textarea name="notes">${escapeHtml(a.notes || '')}</textarea></div>
      </div>
    </form>`;
  const footer = `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button>`;
  modal({
    title: editing ? 'Edit account' : 'New account', body, footer,
    onMount(overlay, close) {
      const form = overlay.querySelector('#acc-form');
      overlay.querySelector('[data-save]').addEventListener('click', () => {
        const name = form.name.value.trim();
        if (!name) { form.name.classList.add('invalid'); return; }
        const payload = {
          name, type: form.type.value,
          startingCapital: parseFloat(form.startingCapital.value) || 0,
          defaultFeeType: form.defaultFeeType.value,
          defaultFeeValue: parseFloat(form.defaultFeeValue.value) || 0,
          notes: form.notes.value.trim(),
        };
        Store.set(st => {
          if (editing) { Object.assign(st.accounts.find(x => x.id === editing.id), payload); }
          else { st.accounts.push(Object.assign({ id: uid(), createdAt: new Date().toISOString() }, payload)); }
        });
        close(); viewSettings(); rerender();
      });
    }
  });
}

/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */
function bindShortcuts() {
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'n' || e.key === 'N') {
      e.preventDefault(); openTradeForm();
    } else if (e.key === '/') {
      e.preventDefault();
      // Focus the first search input on the current view
      const s = document.querySelector('[data-f="search"], [data-jsearch]');
      if (s) s.focus();
    } else if (e.key === '?') {
      e.preventDefault();
      modal({
        title: 'Keyboard shortcuts', size: 'modal-sm',
        body: `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div class="card-row"><span>New trade</span><span class="keyhint">N</span></div>
            <div class="card-row"><span>Focus search</span><span class="keyhint">/</span></div>
            <div class="card-row"><span>Show shortcuts</span><span class="keyhint">?</span></div>
            <div class="card-row"><span>Close modal</span><span class="keyhint">Esc</span></div>
          </div>`,
        footer: `<button class="btn" data-close>Close</button>`,
        onMount() {}
      });
    }
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  Store.load();
  const s = Store.get();
  applyTheme();
  if (!s.meta.onboarded) {
    renderOnboarding();
    return;
  }
  if (!location.hash || location.hash === '#') location.hash = '#/dashboard';
  Router.init();
  bindShortcuts();
  maybeShowIOSChromeBanner();
}

/* ============================================================
   PWA — service worker registration. Cache-first shell, so the
   app launches instantly offline after install.
   ============================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker
      .register('sw.js')
      .catch(err => console.warn('SW registration failed', err));
  });
}

// Boot once DOM is ready.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
