  wireTradesTable();
}

/* ============================================================
   TRADES TABLE — shared rendering for dashboard + trades view
   ============================================================ */
function tradesTable(trades, opts = {}) {
  if (!trades.length) return '<div class="muted" style="padding:24px;text-align:center;">No trades to show.</div>';
  const accounts = Store.get().accounts;
  const accName = id => (accounts.find(a => a.id === id) || {}).name || '—';
  const rows = trades.map(t => {
    const pl = t.status === 'closed' ? tradeNetPL(t) : tradeUnrealized(t);
    const plPct = t.status === 'closed' ? tradePLPct(t) : null;
    const r = tradeRMultiple(t);
    const plClass = pl == null ? 'muted' : (pl > 0 ? 'pos' : (pl < 0 ? 'neg' : ''));
    return `
      <tr class="clickable" data-trade-id="${t.id}">
        <td data-label="Date">${fmtDate(t.entryDate)}</td>
        <td data-label="Ticker"><strong>${escapeHtml(t.ticker)}</strong> <span class="tag">${escapeHtml(t.assetType)}</span></td>
        <td data-label="Side"><span class="pill pill-${t.side === 'Buy' || t.side === 'Cover' ? 'buy' : 'sell'}">${escapeHtml(t.side)}</span></td>
        <td data-label="Qty" class="num">${fmtNum(t.quantity, t.assetType === 'Crypto' ? 4 : 2)}</td>
        <td data-label="Entry" class="num">${fmtMoney(t.entryPrice, { decimals: 2 })}</td>
        ${opts.compact ? '' : `<td data-label="Exit" class="num">${t.status === 'closed' ? fmtMoney(t.exitPrice, { decimals: 2 }) : '<span class="muted">—</span>'}</td>`}
        <td data-label="P&amp;L" class="num ${plClass}">${pl == null ? '<span class="muted">—</span>' : fmtMoney(pl, { signed: true })}</td>
        ${opts.compact ? '' : `<td data-label="P&amp;L %" class="num ${plClass}">${plPct == null ? '—' : fmtPct(plPct, { signed: true })}</td>`}
        ${opts.compact ? '' : `<td data-label="R" class="num">${r == null ? '—' : fmtNum(r, 2) + 'R'}</td>`}
        <td data-label="Status"><span class="pill pill-${t.status}">${t.status}</span></td>
        ${opts.compact ? '' : `<td data-label="Account" class="muted">${escapeHtml(accName(t.accountId))}</td>`}
      </tr>`;
  }).join('');
  return `
    <div class="table-wrap">
      <table class="table-mobile-cards">
        <thead>
          <tr>
            <th>Date</th><th>Ticker</th><th>Side</th><th>Qty</th><th>Entry</th>
            ${opts.compact ? '' : '<th>Exit</th>'}
            <th>P&amp;L</th>
            ${opts.compact ? '' : '<th>P&amp;L %</th><th>R</th>'}
            <th>Status</th>
            ${opts.compact ? '' : '<th>Account</th>'}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
function wireTradesTable(scope = document) {
  scope.querySelectorAll('tr[data-trade-id]').forEach(tr => {
    tr.addEventListener('click', () => openTradeDetail(tr.dataset.tradeId));
  });
}

/* ============================================================
   TRADES VIEW
   ============================================================ */
const tradesState = {
  tab: 'all',
  sort: { key: 'entryDate', dir: 'desc' },
  filters: { account: '', assetType: '', strategy: '', winLoss: '', dateFrom: '', dateTo: '', search: '' },
  page: 1,
  pageSize: 50,
};

function viewTrades() {
  const s = Store.get();
  let trades = [...s.trades];
  // Tab filter
  if (tradesState.tab === 'open') trades = trades.filter(t => t.status === 'open');
  else if (tradesState.tab === 'closed') trades = trades.filter(t => t.status === 'closed');
  // Other filters
  const f = tradesState.filters;
  if (f.account) trades = trades.filter(t => t.accountId === f.account);
  if (f.assetType) trades = trades.filter(t => t.assetType === f.assetType);
  if (f.strategy) trades = trades.filter(t => t.strategy === f.strategy);
  if (f.winLoss === 'win') trades = trades.filter(t => t.status === 'closed' && tradeNetPL(t) > 0);
  if (f.winLoss === 'loss') trades = trades.filter(t => t.status === 'closed' && tradeNetPL(t) < 0);
  if (f.dateFrom) trades = trades.filter(t => new Date(t.entryDate) >= new Date(f.dateFrom));
  if (f.dateTo) trades = trades.filter(t => new Date(t.entryDate) <= new Date(f.dateTo + 'T23:59:59'));
  if (f.search) {
    const q = f.search.toLowerCase();
    trades = trades.filter(t =>
      t.ticker.toLowerCase().includes(q) ||
      (t.preTradeNotes || '').toLowerCase().includes(q) ||
      (t.postTradeNotes || '').toLowerCase().includes(q) ||
      (t.tags || []).some(tag => tag.toLowerCase().includes(q))
    );
  }
  // Sort
  const { key, dir } = tradesState.sort;
  trades.sort((a, b) => {
    const av = sortValue(a, key); const bv = sortValue(b, key);
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
  // Paginate
  const total = trades.length;
  const start = (tradesState.page - 1) * tradesState.pageSize;
  const pageTrades = trades.slice(start, start + tradesState.pageSize);
  const totalPages = Math.max(1, Math.ceil(total / tradesState.pageSize));

  const countOpen = s.trades.filter(t => t.status === 'open').length;
  const countClosed = s.trades.filter(t => t.status === 'closed').length;

  const html = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Trades</h1>
        <p class="page-subtitle">${total} ${total === 1 ? 'trade' : 'trades'} shown</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" data-action="new-trade-page">${ICONS.plus}<span>New trade</span></button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab ${tradesState.tab === 'all' ? 'active' : ''}" data-tab="all">All (${s.trades.length})</button>
      <button class="tab ${tradesState.tab === 'open' ? 'active' : ''}" data-tab="open">Open (${countOpen})</button>
      <button class="tab ${tradesState.tab === 'closed' ? 'active' : ''}" data-tab="closed">Closed (${countClosed})</button>
    </div>

    <div class="filter-bar">
      <input type="text" placeholder="Search ticker or notes…" data-f="search" value="${escapeHtml(f.search)}"/>
      <select data-f="account">
        <option value="">All accounts</option>
        ${s.accounts.map(a => `<option value="${a.id}" ${f.account === a.id ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('')}
      </select>
      <select data-f="assetType">
        <option value="">All asset types</option>
        ${['Stock','ETF','Crypto','Option','Forex','Other'].map(t => `<option value="${t}" ${f.assetType === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
      <select data-f="strategy">
        <option value="">All strategies</option>
        ${s.customTags.strategy.map(t => `<option value="${t}" ${f.strategy === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
      </select>
      <select data-f="winLoss">
        <option value="">Win/Loss</option>
        <option value="win" ${f.winLoss === 'win' ? 'selected' : ''}>Wins</option>
        <option value="loss" ${f.winLoss === 'loss' ? 'selected' : ''}>Losses</option>
      </select>
      <input type="date" data-f="dateFrom" value="${escapeHtml(f.dateFrom)}" title="From"/>
      <input type="date" data-f="dateTo" value="${escapeHtml(f.dateTo)}" title="To"/>
      <button class="btn btn-ghost btn-sm" data-action="clear-filters">Clear</button>
    </div>

    ${pageTrades.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">${ICONS.trades}</div>
        <h3 class="empty-title">${s.trades.length === 0 ? 'No trades yet' : 'No trades match'}</h3>
        <p class="empty-text">${s.trades.length === 0 ? 'Log your first trade to start tracking.' : 'Adjust your filters or clear them to see more.'}</p>
        ${s.trades.length === 0 ? `<button class="btn btn-primary" data-action="new-trade-page">${ICONS.plus}<span>Add a trade</span></button>` : ''}
      </div>
    ` : `
      <div class="table-wrap">
        <table class="table-mobile-cards">
          <thead>
            <tr>
              ${sortableTh('entryDate', 'Date')}
              ${sortableTh('ticker', 'Ticker')}
              ${sortableTh('side', 'Side')}
              ${sortableTh('quantity', 'Qty')}
              ${sortableTh('entryPrice', 'Entry')}
              ${sortableTh('exitPrice', 'Exit')}
              ${sortableTh('pl', 'P&L')}
              ${sortableTh('plPct', 'P&L %')}
              ${sortableTh('rMultiple', 'R')}
              ${sortableTh('holdMs', 'Hold')}
              ${sortableTh('status', 'Status')}
              <th>Tags</th>
            </tr>
          </thead>
          <tbody>
            ${pageTrades.map(t => tradeRow(t)).join('')}
          </tbody>
        </table>
      </div>
      ${totalPages > 1 ? `
        <div style="display:flex;justify-content:center;gap:8px;align-items:center;margin-top:14px;">
          <button class="btn btn-sm" ${tradesState.page <= 1 ? 'disabled' : ''} data-action="prev-page">Prev</button>
          <span class="muted">Page ${tradesState.page} of ${totalPages}</span>
          <button class="btn btn-sm" ${tradesState.page >= totalPages ? 'disabled' : ''} data-action="next-page">Next</button>
        </div>` : ''}
    `}
  `;

  mountView(html);

  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    tradesState.tab = b.dataset.tab; tradesState.page = 1; viewTrades();
  }));
  document.querySelectorAll('[data-f]').forEach(el => {
    const handler = () => { tradesState.filters[el.dataset.f] = el.value; tradesState.page = 1; viewTrades(); };
    el.addEventListener('change', handler);
    if (el.type === 'text') el.addEventListener('input', debounce(handler, 200));
  });
  document.querySelectorAll('[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (tradesState.sort.key === k) tradesState.sort.dir = tradesState.sort.dir === 'asc' ? 'desc' : 'asc';
    else tradesState.sort = { key: k, dir: 'desc' };
    viewTrades();
  }));
  document.querySelectorAll('[data-action="new-trade-page"]').forEach(b => b.addEventListener('click', openTradeForm));
  const clear = document.querySelector('[data-action="clear-filters"]');
  if (clear) clear.addEventListener('click', () => {
    tradesState.filters = { account: '', assetType: '', strategy: '', winLoss: '', dateFrom: '', dateTo: '', search: '' };
    tradesState.page = 1; viewTrades();
  });
  const prev = document.querySelector('[data-action="prev-page"]'); if (prev) prev.addEventListener('click', () => { tradesState.page--; viewTrades(); });
  const next = document.querySelector('[data-action="next-page"]'); if (next) next.addEventListener('click', () => { tradesState.page++; viewTrades(); });
  wireTradesTable();
}

function sortableTh(key, label) {
  const active = tradesState.sort.key === key;
  const arrow = active ? (tradesState.sort.dir === 'asc' ? '↑' : '↓') : '';
  return `<th class="sortable" data-sort="${key}">${label}<span class="sort-arrow">${arrow}</span></th>`;
}

function sortValue(t, key) {
  switch (key) {
    case 'entryDate': return new Date(t.entryDate).getTime();
    case 'exitDate': return t.exitDate ? new Date(t.exitDate).getTime() : 0;
    case 'pl': return t.status === 'closed' ? tradeNetPL(t) : (tradeUnrealized(t) || 0);
    case 'plPct': return t.status === 'closed' ? tradePLPct(t) : 0;
    case 'rMultiple': return tradeRMultiple(t) || 0;
    case 'holdMs': return tradeHoldMs(t);
    case 'quantity': return Number(t.quantity) || 0;
    case 'entryPrice': return Number(t.entryPrice) || 0;
    case 'exitPrice': return Number(t.exitPrice) || 0;
    default: return (t[key] || '').toString().toLowerCase();
  }
}

function tradeRow(t) {
  const pl = t.status === 'closed' ? tradeNetPL(t) : tradeUnrealized(t);
  const plPct = t.status === 'closed' ? tradePLPct(t) : null;
  const r = tradeRMultiple(t);
  const plClass = pl == null ? 'muted' : (pl > 0 ? 'pos' : (pl < 0 ? 'neg' : ''));
  const tags = (t.tags || []).slice(0, 3).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join(' ');
  return `
    <tr class="clickable" data-trade-id="${t.id}">
      <td data-label="Date">${fmtDate(t.entryDate)}</td>
      <td data-label="Ticker"><strong>${escapeHtml(t.ticker)}</strong> <span class="tag">${escapeHtml(t.assetType)}</span></td>
      <td data-label="Side"><span class="pill pill-${t.side === 'Buy' || t.side === 'Cover' ? 'buy' : 'sell'}">${escapeHtml(t.side)}</span></td>
      <td data-label="Qty" class="num">${fmtNum(t.quantity, t.assetType === 'Crypto' ? 4 : 2)}</td>
      <td data-label="Entry" class="num">${fmtMoney(t.entryPrice, { decimals: 2 })}</td>
      <td data-label="Exit" class="num">${t.status === 'closed' ? fmtMoney(t.exitPrice, { decimals: 2 }) : '<span class="muted">—</span>'}</td>
      <td data-label="P&amp;L" class="num ${plClass}">${pl == null ? '<span class="muted">—</span>' : fmtMoney(pl, { signed: true })}</td>
      <td data-label="P&amp;L %" class="num ${plClass}">${plPct == null ? '—' : fmtPct(plPct, { signed: true })}</td>
      <td data-label="R" class="num">${r == null ? '—' : fmtNum(r, 2) + 'R'}</td>
      <td data-label="Hold" class="num muted">${durationHuman(tradeHoldMs(t))}</td>
      <td data-label="Status"><span class="pill pill-${t.status}">${t.status}</span></td>
      <td data-label="Tags">${tags}</td>
    </tr>`;
}

function debounce(fn, ms) {
  let to; return (...args) => { clearTimeout(to); to = setTimeout(() => fn(...args), ms); };
}

/* ============================================================
   TRADE FORM (new + edit)
   ============================================================ */
function openTradeForm(existingId = null) {
  const s = Store.get();
  if (s.accounts.length === 0) {
    confirmModal({
      title: 'Add an account first',
      message: 'You need at least one account to record trades against. Open Settings → Accounts?',
      confirmText: 'Open Settings',
      onConfirm: () => Router.nav('#/settings'),
    });
    return;
  }
  const editing = existingId ? s.trades.find(t => t.id === existingId) : null;
  let screenshotId = editing ? editing.screenshotId : null;
  let screenshotPreview = null;
  if (screenshotId) {
    Screenshots.get(screenshotId).then(data => {
      screenshotPreview = data;
      const img = document.querySelector('[data-screenshot-preview]');
      if (img && data) img.src = data;
    });
  }
  const t = editing || {
    accountId: s.accounts[0].id,
    assetType: 'Stock',
    side: 'Buy',
    ticker: '',
    quantity: '',
    entryPrice: '',
    entryDate: new Date().toISOString(),
    entryFees: defaultFeeFor(s.accounts[0].id, 0, 0),
    stopLoss: '',
    takeProfit: '',
    strategy: s.customTags.strategy[0] || '',
    setupType: s.customTags.setup[0] || '',
    preTradeNotes: '',
    conviction: 3,
    entryEmotion: 'Calm',
    tags: [],
  };
  const allTags = Array.from(new Set(s.trades.flatMap(tr => tr.tags || []))).slice(0, 50);

  const body = `
    <form id="trade-form" novalidate>
      ${s.checklist.required && s.checklist.items.some(i => i.enabled) ? `
        <div class="card" style="margin-bottom:14px;background:var(--bg-elev-2);">
          <h3 class="card-title">Pre-trade checklist</h3>
          <div class="checklist">
            ${s.checklist.items.filter(i => i.enabled).map(i => `
              <label class="checklist-item">
                <input type="checkbox" data-checklist="${i.id}"/>
                <span>${escapeHtml(i.text)}</span>
              </label>`).join('')}
          </div>
        </div>` : ''}
      <div class="form-grid">
        <div class="field">
          <label>Account</label>
          <select name="accountId">
            ${s.accounts.map(a => `<option value="${a.id}" ${a.id === t.accountId ? 'selected' : ''}>${escapeHtml(a.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Asset type</label>
          <select name="assetType">
            ${['Stock','ETF','Crypto','Option','Forex','Other'].map(x => `<option ${x === t.assetType ? 'selected' : ''}>${x}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Side</label>
          <select name="side">
            ${['Buy','Sell','Short','Cover'].map(x => `<option ${x === t.side ? 'selected' : ''}>${x}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Ticker</label>
          <input type="text" name="ticker" placeholder="AAPL" value="${escapeHtml(t.ticker)}" required style="text-transform:uppercase"/>
          <span class="error" data-error="ticker"></span>
        </div>
        <div class="field">
          <label>Quantity</label>
          <input type="number" name="quantity" step="any" min="0" placeholder="100" value="${escapeHtml(t.quantity)}" required/>
          <span class="error" data-error="quantity"></span>
        </div>
        <div class="field">
          <label>Entry price</label>
          <input type="number" name="entryPrice" step="any" min="0" placeholder="0.00" value="${escapeHtml(t.entryPrice)}" required/>
          <span class="error" data-error="entryPrice"></span>
        </div>
        <div class="field">
          <label>Entry date/time</label>
          <input type="datetime-local" name="entryDate" value="${localDateInput(t.entryDate)}"/>
        </div>
        <div class="field">
          <label>Fees</label>
          <input type="number" name="entryFees" step="any" min="0" value="${escapeHtml(t.entryFees)}"/>
        </div>
        <div class="field">
          <label>Stop loss <span class="hint">optional</span></label>
          <input type="number" name="stopLoss" step="any" min="0" value="${escapeHtml(t.stopLoss)}"/>
        </div>
        <div class="field">
          <label>Take profit <span class="hint">optional</span></label>
          <input type="number" name="takeProfit" step="any" min="0" value="${escapeHtml(t.takeProfit)}"/>
        </div>
        <div class="field field-full">
          <label>Risk/Reward <span class="hint">auto-calculated</span></label>
          <div class="mono" data-rr style="padding:9px 11px;background:var(--bg-elev-2);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);">—</div>
        </div>
        <div class="field">
          <label>Strategy</label>
          <select name="strategy">
            ${s.customTags.strategy.map(x => `<option ${x === t.strategy ? 'selected' : ''}>${escapeHtml(x)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Setup type</label>
          <select name="setupType">
            ${s.customTags.setup.map(x => `<option ${x === t.setupType ? 'selected' : ''}>${escapeHtml(x)}</option>`).join('')}
          </select>
        </div>
        <div class="field field-full">
          <label>Pre-trade thesis <span class="hint">max 500 chars</span></label>
          <textarea name="preTradeNotes" maxlength="500" placeholder="What's the setup? What's your edge here?">${escapeHtml(t.preTradeNotes || '')}</textarea>
        </div>
        <div class="field">
          <label>Conviction (1–5)</label>
          <div class="range-wrap">
            <input type="range" name="conviction" min="1" max="5" step="1" value="${t.conviction || 3}"/>
            <span class="range-val mono" data-conv>${t.conviction || 3}</span>
          </div>
        </div>
        <div class="field">
          <label>Emotional state</label>
          <select name="entryEmotion">
            ${['Calm','Confident','FOMO','Uncertain','Revenge','Other'].map(x => `<option ${x === t.entryEmotion ? 'selected' : ''}>${x}</option>`).join('')}
          </select>
        </div>
        <div class="field field-full">
          <label>Tags <span class="hint">comma-separated</span></label>
          <input type="text" name="tags" placeholder="e.g. earnings, gap-up" value="${escapeHtml((t.tags || []).join(', '))}" list="tag-suggestions"/>
          ${allTags.length ? `<datalist id="tag-suggestions">${allTags.map(tg => `<option value="${escapeHtml(tg)}">`).join('')}</datalist>` : ''}
        </div>
        <div class="field field-full">
          <label>Screenshot <span class="hint">optional, max 2MB, resized to 1600px</span></label>
          <input type="file" name="screenshot" accept="image/*"/>
          <img data-screenshot-preview src="" style="display:${screenshotId ? 'block' : 'none'};max-width:240px;border-radius:6px;border:1px solid var(--border);margin-top:8px;" alt="preview"/>
        </div>
      </div>
    </form>`;
  const footer = `
    <button class="btn" data-close>Cancel</button>
    <button class="btn btn-primary" data-save>${editing ? 'Save changes' : 'Save trade'}</button>`;
  modal({
    title: editing ? 'Edit trade' : 'New trade',
    body, footer, size: 'modal-lg',
    onMount(overlay, close) {
      const form = overlay.querySelector('#trade-form');
      // R:R live calc
      const updateRR = () => {
        const entry = parseFloat(form.entryPrice.value);
        const sl = parseFloat(form.stopLoss.value);
        const tp = parseFloat(form.takeProfit.value);
        const rrEl = overlay.querySelector('[data-rr]');
        if (entry && sl && tp) {
          const r = Math.abs(entry - sl), rw = Math.abs(tp - entry);
          if (r > 0) rrEl.textContent = '1 : ' + (rw / r).toFixed(2);
        } else rrEl.textContent = '—';
      };
      ['entryPrice', 'stopLoss', 'takeProfit'].forEach(n => form[n].addEventListener('input', updateRR));
      updateRR();
      // Conviction slider
      form.conviction.addEventListener('input', () => overlay.querySelector('[data-conv]').textContent = form.conviction.value);
      // Account → default fees
      form.accountId.addEventListener('change', () => {
        const acc = Store.get().accounts.find(a => a.id === form.accountId.value);
        if (acc && !form.entryFees.value) form.entryFees.value = defaultFeeFor(acc.id, parseFloat(form.entryPrice.value) || 0, parseFloat(form.quantity.value) || 0);
      });
      // Uppercase ticker
      form.ticker.addEventListener('input', () => { form.ticker.value = form.ticker.value.toUpperCase(); });
      // Screenshot
      let newScreenshotData = null;
      form.screenshot.addEventListener('change', async e => {
        const file = e.target.files[0]; if (!file) return;
        if (file.size > 2 * 1024 * 1024) { toast('Image too large (max 2 MB)', 'error'); form.screenshot.value = ''; return; }
        try {
          const resized = await resizeImage(file, 1600);
          newScreenshotData = resized;
          const img = overlay.querySelector('[data-screenshot-preview]');
          img.src = resized; img.style.display = 'block';
        } catch (err) { toast('Could not read image', 'error'); }
      });
      // Save
      overlay.querySelector('[data-save]').addEventListener('click', async () => {
        // Validate
        let ok = true;
        const errs = { ticker: '', quantity: '', entryPrice: '' };
        if (!form.ticker.value.trim()) { errs.ticker = 'Required'; ok = false; }
        const qty = parseFloat(form.quantity.value);
        if (!(qty > 0)) { errs.quantity = 'Must be > 0'; ok = false; }
        const ep = parseFloat(form.entryPrice.value);
        if (!(ep > 0)) { errs.entryPrice = 'Must be > 0'; ok = false; }
        // Checklist required
        if (s.checklist.required) {
          const required = overlay.querySelectorAll('[data-checklist]');
          if (Array.from(required).some(c => !c.checked)) {
            toast('Complete the pre-trade checklist', 'error'); ok = false;
          }
        }
        Object.entries(errs).forEach(([k, v]) => {
          const el = overlay.querySelector(`[data-error="${k}"]`); if (el) el.textContent = v;
          const inp = form[k]; if (inp) inp.classList.toggle('invalid', !!v);
        });
        if (!ok) return;

        // Save screenshot if changed
        if (newScreenshotData) {
          screenshotId = screenshotId || uid();
          await Screenshots.put(screenshotId, newScreenshotData);
        }
        const payload = {
          accountId: form.accountId.value,
          assetType: form.assetType.value,
          side: form.side.value,
          ticker: form.ticker.value.trim().toUpperCase(),
          quantity: parseFloat(form.quantity.value),
          entryPrice: parseFloat(form.entryPrice.value),
          entryDate: form.entryDate.value ? new Date(form.entryDate.value).toISOString() : new Date().toISOString(),
          entryFees: parseFloat(form.entryFees.value) || 0,
          stopLoss: form.stopLoss.value ? parseFloat(form.stopLoss.value) : null,
          takeProfit: form.takeProfit.value ? parseFloat(form.takeProfit.value) : null,
          strategy: form.strategy.value,
          setupType: form.setupType.value,
          preTradeNotes: form.preTradeNotes.value.trim(),
          conviction: parseInt(form.conviction.value, 10),
          entryEmotion: form.entryEmotion.value,
          tags: form.tags.value.split(',').map(x => x.trim()).filter(Boolean),
          screenshotId,
          updatedAt: new Date().toISOString(),
        };
        Store.set(st => {
          if (editing) {
            const idx = st.trades.findIndex(x => x.id === editing.id);
            st.trades[idx] = Object.assign({}, st.trades[idx], payload);
          } else {
            st.trades.push(Object.assign({
              id: uid(),
              status: 'open',
              exitPrice: null, exitDate: null, exitFees: 0,
              exitReason: null, postTradeNotes: '', exitEmotion: null,
              mistakes: [], followedPlan: null,
              createdAt: new Date().toISOString(),
            }, payload));
          }
        });
        close();
        toast(editing ? 'Trade updated' : 'Trade saved', 'success');
        rerender();
      });
    }
  });
}

function defaultFeeFor(accountId, price, qty) {
  const acc = Store.get().accounts.find(a => a.id === accountId);
  if (!acc) return 0;
  if (acc.defaultFeeType === 'pct') return ((price * qty) || 0) * (Number(acc.defaultFeeValue) || 0) / 100;
  return Number(acc.defaultFeeValue) || 0;
}

async function resizeImage(file, maxW) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   CLOSE TRADE
   ============================================================ */
function openCloseTrade(tradeId) {
  const s = Store.get();
  const t = s.trades.find(x => x.id === tradeId);
  if (!t || t.status === 'closed') return;
  const body = `
    <form id="close-form" novalidate>
      <div class="form-grid">
        <div class="field">
          <label>Exit price</label>
          <input type="number" name="exitPrice" step="any" min="0" required/>
          <span class="error" data-error="exitPrice"></span>
        </div>
        <div class="field">
          <label>Exit date/time</label>
          <input type="datetime-local" name="exitDate" value="${localDateInput(new Date())}"/>
        </div>
        <div class="field">
          <label>Exit fees</label>
          <input type="number" name="exitFees" step="any" min="0" value="${defaultFeeFor(t.accountId, 0, t.quantity)}"/>
        </div>
        <div class="field">
          <label>Exit reason</label>
          <select name="exitReason">
            <option>Target hit</option><option>Stop hit</option><option>Manual</option><option>Time-based</option><option>Thesis invalidated</option>
          </select>
        </div>
        <div class="field">
          <label>Emotional state at exit</label>
          <select name="exitEmotion">
            ${['Calm','Confident','FOMO','Uncertain','Revenge','Other'].map(x => `<option>${x}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Followed the plan?</label>
          <select name="followedPlan"><option value="">—</option><option value="yes">Yes</option><option value="no">No</option></select>
        </div>
        <div class="field field-full">
          <label>Mistakes made <span class="hint">tap to toggle</span></label>
          <div class="chips" data-mistakes>
            ${s.customTags.mistake.map(m => `<span class="chip" data-mistake="${escapeHtml(m)}">${escapeHtml(m)}</span>`).join('')}
          </div>
        </div>
        <div class="field field-full">
          <label>Post-trade notes</label>
          <textarea name="postTradeNotes" placeholder="What worked? What didn't?"></textarea>
        </div>
      </div>
      <div class="card" style="margin-top:14px;background:var(--bg-elev-2);">
        <div class="grid grid-3">
          <div><div class="muted" style="font-size:11px;">P&amp;L</div><div class="mono" data-preview-pl style="font-weight:600;font-size:16px;">—</div></div>
          <div><div class="muted" style="font-size:11px;">P&amp;L %</div><div class="mono" data-preview-plpct style="font-weight:600;font-size:16px;">—</div></div>
          <div><div class="muted" style="font-size:11px;">R-multiple</div><div class="mono" data-preview-r style="font-weight:600;font-size:16px;">—</div></div>
        </div>
      </div>
    </form>`;
  const footer = `
    <button class="btn" data-close>Cancel</button>
    <button class="btn btn-primary" data-save>Close trade</button>`;
  modal({
    title: `Close ${t.ticker} (${t.quantity})`,
    body, footer,
    onMount(overlay, close) {
      const form = overlay.querySelector('#close-form');
      const chips = new Set();
      overlay.querySelectorAll('[data-mistake]').forEach(c => {
        c.addEventListener('click', () => {
          if (chips.has(c.dataset.mistake)) { chips.delete(c.dataset.mistake); c.classList.remove('active'); }
          else { chips.add(c.dataset.mistake); c.classList.add('active'); }
        });
      });
      const updatePreview = () => {
        const ep = parseFloat(form.exitPrice.value);
        if (!ep) return;
        const sim = Object.assign({}, t, { exitPrice: ep, exitFees: parseFloat(form.exitFees.value) || 0, status: 'closed' });
        const pl = tradeNetPL(sim), plPct = tradePLPct(sim), r = tradeRMultiple(sim);
        overlay.querySelector('[data-preview-pl]').innerHTML = `<span class="${pl >= 0 ? 'pos' : 'neg'}">${fmtMoney(pl, { signed: true })}</span>`;
        overlay.querySelector('[data-preview-plpct]').innerHTML = `<span class="${pl >= 0 ? 'pos' : 'neg'}">${fmtPct(plPct, { signed: true })}</span>`;
        overlay.querySelector('[data-preview-r]').innerHTML = r == null ? '<span class="muted">—</span>' : `<span class="${r >= 0 ? 'pos' : 'neg'}">${fmtNum(r, 2)}R</span>`;
      };
      ['exitPrice', 'exitFees'].forEach(n => form[n].addEventListener('input', updatePreview));
      overlay.querySelector('[data-save]').addEventListener('click', () => {
        const ep = parseFloat(form.exitPrice.value);
        const errEl = overlay.querySelector('[data-error="exitPrice"]');
        if (!(ep > 0)) { errEl.textContent = 'Must be > 0'; form.exitPrice.classList.add('invalid'); return; }
        Store.set(st => {
          const idx = st.trades.findIndex(x => x.id === t.id);
          st.trades[idx] = Object.assign({}, st.trades[idx], {
            exitPrice: ep,
            exitDate: form.exitDate.value ? new Date(form.exitDate.value).toISOString() : new Date().toISOString(),
            exitFees: parseFloat(form.exitFees.value) || 0,
            exitReason: form.exitReason.value,
            exitEmotion: form.exitEmotion.value,
            followedPlan: form.followedPlan.value || null,
            mistakes: Array.from(chips),
            postTradeNotes: form.postTradeNotes.value.trim(),
            status: 'closed',
            updatedAt: new Date().toISOString(),
          });
        });
        close();
        toast('Trade closed', 'success');
        rerender();
      });
    }
  });
}

        <div class="detail-field"><span class="label">Hold</span><span class="value">${durationHuman(tradeHoldMs(t))}</span></div>

        <div class="detail-field"><span class="label">R-multiple</span><span class="value mono">${r == null ? '—' : fmtNum(r, 2) + 'R'}</span></div>
        <div class="detail-field"><span class="label">Exit reason</span><span class="value">${escapeHtml(t.exitReason || '—')}</span></div>
        <div class="detail-field"><span class="label">Followed plan?</span><span class="value">${t.followedPlan ? (t.followedPlan === 'yes' ? 'Yes' : 'No') : '—'}</span></div>
      ` : `
        <div class="detail-field"><span class="label">Unrealized P&amp;L</span><span class="value mono ${plClass}">${pl == null ? '<span class="muted">—</span> (no price)' : fmtMoney(pl, { signed: true })}</span></div>
        <div class="detail-field"><span class="label">Hold</span><span class="value">${durationHuman(tradeHoldMs(t))}</span></div>
      `}
      <div class="detail-field"><span class="label">Fees</span><span class="value mono">${fmtMoney(tradeFees(t))}</span></div>
      <div class="detail-field"><span class="label">Stop / Target</span><span class="value mono">${t.stopLoss ? fmtMoney(t.stopLoss) : '—'} / ${t.takeProfit ? fmtMoney(t.takeProfit) : '—'}</span></div>
      <div class="detail-field"><span class="label">Planned R:R</span><span class="value mono">${rr == null ? '—' : '1 : ' + fmtNum(rr, 2)}</span></div>
      <div class="detail-field"><span class="label">Strategy</span><span class="value">${escapeHtml(t.strategy || '—')} · ${escapeHtml(t.setupType || '')}</span></div>

    ${t.postTradeNotes ? `<div style="margin-top:16px;"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;">Post-trade notes</div><p style="margin:6px 0 0;">${escapeHtml(t.postTradeNotes)}</p></div>` : ''}

            <div style="margin-top:16px;"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Screenshot</div>
            <img class="detail-screenshot" src="${data}" alt="Trade screenshot"/></div>`;
        });
      }
      const closeBtn = overlay.querySelector('[data-act="close-trade"]');
      if (closeBtn) closeBtn.addEventListener('click', () => { close(); openCloseTrade(t.id); });
      overlay.querySelector('[data-act="edit-trade"]').addEventListener('click', () => { close(); openTradeForm(t.id); });
      overlay.querySelector('[data-act="delete-trade"]').addEventListener('click', () => {
        confirmModal({
          title: 'Delete trade?',
          message: `This will permanently remove the ${t.ticker} trade and its screenshot.`,
          confirmText: 'Delete', danger: true,
          onConfirm: async () => {
            if (t.screenshotId) await Screenshots.remove(t.screenshotId);
            Store.set(st => { st.trades = st.trades.filter(x => x.id !== t.id); });
            close();
            toast('Trade deleted', 'success');
            rerender();
          }
        });
      });
    }
  });
}

/* ============================================================

function openPriceUpdate() {
  const s = Store.get();
  const openTrades = s.trades.filter(t => t.status === 'open');
  const tickers = Array.from(new Set(openTrades.map(t => t.ticker)));
  if (!tickers.length) { toast('No open positions to price', 'info'); return; }
  const body = `
    <p class="muted" style="margin-top:0;">Enter the latest price for each open position. Leave blank to skip.</p>
    <div class="form-grid">
      ${tickers.map(tk => `
        <div class="field">
          <label>${escapeHtml(tk)} <span class="hint">last: ${s.currentPrices[tk]?.price ? fmtMoney(s.currentPrices[tk].price) : '—'}</span></label>
          <input type="number" step="any" min="0" data-ticker="${escapeHtml(tk)}" value="${s.currentPrices[tk]?.price || ''}" placeholder="0.00"/>
        </div>`).join('')}
    </div>`;
  const footer = `
    <button class="btn" data-close>Cancel</button>
    <button class="btn btn-primary" data-save>Save prices</button>`;
  modal({
    title: 'Update prices', body, footer,
    onMount(overlay, close) {
      overlay.querySelector('[data-save]').addEventListener('click', () => {
        Store.set(st => {
          overlay.querySelectorAll('[data-ticker]').forEach(inp => {
            const v = parseFloat(inp.value);
            if (v > 0) st.currentPrices[inp.dataset.ticker] = { price: v, updatedAt: new Date().toISOString() };

        });
        close();
        toast('Prices updated', 'success');
        rerender();
      });
    }
  });
}

/* ============================================================
   PORTFOLIO VIEW
   ============================================================ */
function viewPortfolio() {
  const s = Store.get();
  const stats = getStats();
  const open = s.trades.filter(t => t.status === 'open');

  // Aggregate by ticker+account+side
  const positions = open.map(t => {
    const price = s.currentPrices[t.ticker]?.price;
    const value = tradeCurrentValue(t) ?? (Number(t.entryPrice) * Number(t.quantity));
    const unreal = tradeUnrealized(t);
    const acc = s.accounts.find(a => a.id === t.accountId);
    return { t, price, value, unreal, acc };
  });
  const totalOpenValue = positions.reduce((a, p) => a + p.value, 0);

  // Allocation by type
  const allocByType = (() => {
    const m = {};
    positions.forEach(p => { m[p.t.assetType] = (m[p.t.assetType] || 0) + p.value; });
    if (stats.cash > 0) m['Cash'] = stats.cash;
    return Object.entries(m).map(([label, value]) => ({ label, value }));
  })();
  // Allocation by account
  const allocByAccount = (() => {
    const m = {};
    positions.forEach(p => {
      const name = p.acc ? p.acc.name : 'Unknown';
      m[name] = (m[name] || 0) + p.value;
    });
    return Object.entries(m).map(([label, value]) => ({ label, value }));
  })();
  // Cash per account
  const cashByAccount = s.accounts.map(a => {
    const realized = s.trades.filter(t => t.status === 'closed' && t.accountId === a.id).reduce((s2, t) => s2 + tradeNetPL(t), 0);
    const openCost = s.trades.filter(t => t.status === 'open' && t.accountId === a.id).reduce((s2, t) => s2 + Number(t.entryPrice) * Number(t.quantity) + (Number(t.entryFees) || 0), 0);
    const cash = (Number(a.startingCapital) || 0) + realized - openCost;
    return { name: a.name, cash };
  });

  const html = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Portfolio</h1>
        <p class="page-subtitle">${open.length} open ${open.length === 1 ? 'position' : 'positions'} · ${fmtMoney(stats.portfolioValue)} total</p>
      </div>
      <div class="page-actions">
        <button class="btn" data-action="update-prices">${ICONS.refresh}<span>Update prices</span></button>
        <button class="btn btn-primary" data-action="new-trade-pf">${ICONS.plus}<span>New trade</span></button>
      </div>
    </div>

    <div class="grid grid-4">
      <div class="stat"><span class="stat-label">Portfolio value</span><span class="stat-value">${fmtMoney(stats.portfolioValue)}</span><span class="stat-sub muted">Cash + open</span></div>
      <div class="stat"><span class="stat-label">Open value</span><span class="stat-value">${fmtMoney(stats.openValue)}</span><span class="stat-sub muted">${open.length} positions</span></div>
      <div class="stat"><span class="stat-label">Unrealized P&amp;L</span><span class="stat-value ${stats.openUnrealized > 0 ? 'pos' : stats.openUnrealized < 0 ? 'neg' : ''}">${fmtMoney(stats.openUnrealized, { signed: true })}</span></div>
      <div class="stat"><span class="stat-label">Cash</span><span class="stat-value">${fmtMoney(stats.cash)}</span><span class="stat-sub muted">${s.accounts.length} accounts</span></div>
    </div>

    ${open.length === 0 ? `
      <div class="card" style="margin-top:16px;">
        <div class="empty">
          <div class="empty-icon">${ICONS.portfolio}</div>
          <h3 class="empty-title">No open positions</h3>
          <p class="empty-text">Open trades will appear here with their current market value.</p>
          <button class="btn btn-primary" data-action="new-trade-pf">${ICONS.plus}<span>Add a trade</span></button>
        </div>
      </div>
    ` : `
      <div class="card" style="margin-top:16px;">
        <h3 class="card-title">Open positions</h3>
        <div class="table-wrap">
          <table class="table-mobile-cards">
            <thead><tr>
              <th>Ticker</th><th>Account</th><th>Type</th><th>Qty</th><th>Avg Cost</th>
              <th>Price</th><th>Value</th><th>Unrealized</th><th>%</th><th>Weight</th><th>Days</th>
            </tr></thead>
            <tbody>
              ${positions.map(p => {
                const cost = Number(p.t.entryPrice) * Number(p.t.quantity);
                const plClass = p.unreal == null ? 'muted' : (p.unreal > 0 ? 'pos' : p.unreal < 0 ? 'neg' : '');
                const pct = p.unreal != null && cost > 0 ? (p.unreal / cost) * 100 : null;
                const weight = totalOpenValue > 0 ? (p.value / totalOpenValue) * 100 : 0;
                const days = Math.floor(tradeHoldMs(p.t) / (1000 * 60 * 60 * 24));
                return `
                  <tr class="clickable" data-trade-id="${p.t.id}">
                    <td data-label="Ticker"><strong>${escapeHtml(p.t.ticker)}</strong></td>
                    <td data-label="Account" class="muted">${escapeHtml(p.acc ? p.acc.name : '—')}</td>
                    <td data-label="Type">${escapeHtml(p.t.assetType)}</td>
                    <td data-label="Qty" class="num">${fmtNum(p.t.quantity, p.t.assetType === 'Crypto' ? 4 : 2)}</td>
                    <td data-label="Avg Cost" class="num">${fmtMoney(p.t.entryPrice)}</td>
                    <td data-label="Price" class="num">
                      <input type="number" step="any" min="0" class="inline-price" data-ticker="${escapeHtml(p.t.ticker)}" value="${p.price || ''}" placeholder="—" style="padding:5px 8px;font-size:12.5px;width:90px;"/>
                    </td>
                    <td data-label="Value" class="num mono">${fmtMoney(p.value)}</td>
                    <td data-label="Unrealized" class="num mono ${plClass}">${p.unreal == null ? '<span class="muted">—</span>' : fmtMoney(p.unreal, { signed: true })}</td>
                    <td data-label="%" class="num mono ${plClass}">${pct == null ? '—' : fmtPct(pct, { signed: true })}</td>
                    <td data-label="Weight" class="num mono muted">${fmtNum(weight, 1)}%</td>
                    <td data-label="Days" class="num muted">${days}</td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="grid grid-12" style="margin-top:16px;">
        <div class="card span-6">
          <h3 class="card-title">Allocation by asset type</h3>
          ${donutChart(allocByType, { size: 200, centerLabel: 'Total', centerValue: fmtMoney(stats.portfolioValue, { decimals: 0 }) })}
        </div>
        <div class="card span-6">
          <h3 class="card-title">Allocation by account</h3>
          ${donutChart(allocByAccount, { size: 200, centerLabel: 'Open', centerValue: fmtMoney(totalOpenValue, { decimals: 0 }) })}
        </div>
      </div>
    `}

    <div class="card" style="margin-top:16px;">
      <h3 class="card-title">Cash by account</h3>
      ${s.accounts.length === 0 ? '<p class="muted">No accounts yet.</p>' : `
        <div class="table-wrap">
          <table class="table-mobile-cards">
            <thead><tr><th>Account</th><th>Starting capital</th><th>Cash</th></tr></thead>
            <tbody>
              ${cashByAccount.map(a => `
                <tr><td data-label="Account">${escapeHtml(a.name)}</td>
                <td data-label="Starting" class="num">${fmtMoney(s.accounts.find(x => x.name === a.name)?.startingCapital || 0)}</td>
                <td data-label="Cash" class="num mono">${fmtMoney(a.cash)}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>`}
    </div>
  `;
  mountView(html);
  document.querySelectorAll('[data-action="update-prices"]').forEach(b => b.addEventListener('click', openPriceUpdate));
  document.querySelectorAll('[data-action="new-trade-pf"]').forEach(b => b.addEventListener('click', openTradeForm));
  document.querySelectorAll('.inline-price').forEach(inp => {
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('change', () => {
      const v = parseFloat(inp.value);
      Store.set(st => {
        if (v > 0) st.currentPrices[inp.dataset.ticker] = { price: v, updatedAt: new Date().toISOString() };
        else delete st.currentPrices[inp.dataset.ticker];
      });
      rerender();
    });
  });
  wireTradesTable();
}

/* ============================================================
   ANALYTICS VIEW
   ============================================================ */
function viewAnalytics() {
  const s = Store.get();
  const closed = s.trades.filter(t => t.status === 'closed');
  if (closed.length === 0) {
    mountView(`
      <div class="page-header"><div><h1 class="page-title">Analytics</h1></div></div>
      <div class="card">
        <div class="empty">
          <div class="empty-icon">${ICONS.analytics}</div>
          <h3 class="empty-title">Analytics need data</h3>
          <p class="empty-text">Close at least one trade to see breakdowns by strategy, setup, and more.</p>
        </div>
      </div>`);
    return;
  }

  const winRateBy = (key) => {
    const groups = {};
    closed.forEach(t => {
      const k = t[key] || 'Other';
      groups[k] = groups[k] || { wins: 0, total: 0, pl: 0 };
      groups[k].total++;
      const pl = tradeNetPL(t);
      groups[k].pl += pl;
      if (pl > 0) groups[k].wins++;
    });
    return Object.entries(groups).map(([k, v]) => ({
      label: k,
      value: v.total ? (v.wins / v.total) * 100 : 0,
      pl: v.pl,
      total: v.total,
    }));
  };
  const winByStrategy = winRateBy('strategy');
  const winBySetup = winRateBy('setupType');
  const winByAsset = winRateBy('assetType');

  // R-multiples histogram
  const rValues = closed.map(tradeRMultiple).filter(r => r != null);

  // Day of week
  const dayBuckets = [0,0,0,0,0,0,0].map(() => ({ pl: 0, count: 0 }));
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  closed.forEach(t => {
    const d = new Date(t.exitDate).getDay();
    dayBuckets[d].pl += tradeNetPL(t);
    dayBuckets[d].count++;
  });
  const dayItems = dayBuckets.map((b, i) => ({ label: dayNames[i], value: b.pl }));

  // Hold buckets
  const holdBuckets = { '<1d': 0, '1–7d': 0, '1–4w': 0, '>1mo': 0 };
  const holdCounts = { '<1d': 0, '1–7d': 0, '1–4w': 0, '>1mo': 0 };
  closed.forEach(t => {
    const days = tradeHoldMs(t) / (1000 * 60 * 60 * 24);
    const pl = tradeNetPL(t);
    const k = days < 1 ? '<1d' : days < 7 ? '1–7d' : days < 28 ? '1–4w' : '>1mo';
    holdBuckets[k] += pl;
    holdCounts[k]++;
  });
  const holdItems = Object.entries(holdBuckets).map(([k, v]) => ({ label: `${k} (${holdCounts[k]})`, value: v }));

  // Average win vs avg loss
  const wins = closed.filter(t => tradeNetPL(t) > 0);
  const losses = closed.filter(t => tradeNetPL(t) < 0);
  const avgWin = wins.length ? wins.reduce((a, t) => a + tradeNetPL(t), 0) / wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((a, t) => a + tradeNetPL(t), 0)) / losses.length : 0;
  const wlItems = [
    { label: `Avg win (${wins.length})`, value: avgWin, color: 'var(--pos)' },
    { label: `Avg loss (${losses.length})`, value: avgLoss, color: 'var(--neg)' },
  ];

  // Monthly heatmap data
  const dailyPL = {};
  closed.forEach(t => {
    const k = dayKey(t.exitDate);
    dailyPL[k] = (dailyPL[k] || 0) + tradeNetPL(t);
  });

  // Mistakes
  const mistakeCounts = {}; const mistakeCost = {};
  closed.forEach(t => {
    (t.mistakes || []).forEach(m => {
      mistakeCounts[m] = (mistakeCounts[m] || 0) + 1;
      const pl = tradeNetPL(t);
      if (pl < 0) mistakeCost[m] = (mistakeCost[m] || 0) + pl;
    });
  });
  const mistakeFreq = Object.entries(mistakeCounts).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ label: k, value: v, color: 'var(--warn)' }));
  const mistakeCostItems = Object.entries(mistakeCost).sort((a, b) => a[1] - b[1]).map(([k, v]) => ({ label: k, value: v }));

  const stats = getStats();

  const html = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Analytics</h1>
        <p class="page-subtitle">${closed.length} closed trades · ${fmtPct(stats.winRate)} win rate</p>
      </div>
      <div class="page-actions">
        <button class="btn" data-action="print">${ICONS.print}<span>Print report</span></button>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h3 class="card-title">Monthly P&amp;L heatmap (last 12 months)</h3>
      ${heatmapCalendar(dailyPL)}
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:10px;font-size:11px;" class="muted">
        <span>Loss</span>
        <div style="display:flex;gap:2px;">
          <div style="width:10px;height:10px;background:rgba(239,68,68,0.8);border-radius:2px;"></div>
          <div style="width:10px;height:10px;background:rgba(239,68,68,0.4);border-radius:2px;"></div>
          <div style="width:10px;height:10px;background:var(--bg-elev-2);border-radius:2px;"></div>
          <div style="width:10px;height:10px;background:rgba(34,197,94,0.4);border-radius:2px;"></div>
          <div style="width:10px;height:10px;background:rgba(34,197,94,0.8);border-radius:2px;"></div>
        </div>
        <span>Win</span>
      </div>
    </div>

    <div class="grid grid-12">
      <div class="card span-6">
        <h3 class="card-title">Win rate by strategy</h3>
        ${barChart(winByStrategy, { height: 220, fmt: v => v.toFixed(0) + '%' })}
      </div>
      <div class="card span-6">
        <h3 class="card-title">Win rate by setup type</h3>
        ${barChart(winBySetup, { height: 220, fmt: v => v.toFixed(0) + '%' })}
      </div>
      <div class="card span-6">
        <h3 class="card-title">Win rate by asset type</h3>
        ${barChart(winByAsset, { height: 220, fmt: v => v.toFixed(0) + '%' })}
      </div>
      <div class="card span-6">
        <h3 class="card-title">R-multiple distribution</h3>
        ${histogramChart(rValues, { height: 220 })}
      </div>
      <div class="card span-6">
        <h3 class="card-title">P&amp;L by day of week</h3>
        ${barChart(dayItems, { height: 220, fmt: v => fmtMoney(v, { decimals: 0 }) })}
      </div>
      <div class="card span-6">
        <h3 class="card-title">P&amp;L by hold period</h3>
        ${barChart(holdItems, { height: 220, fmt: v => fmtMoney(v, { decimals: 0 }) })}
      </div>
      <div class="card span-6">
        <h3 class="card-title">Avg win vs avg loss</h3>
        ${barChart(wlItems, { height: 220, fmt: v => fmtMoney(v, { decimals: 0 }) })}
      </div>
      <div class="card span-6">
        <h3 class="card-title">Risk metrics</h3>
        <div style="display:flex;flex-direction:column;gap:14px;">
          <div class="card-row"><span class="muted">Max drawdown</span><span class="mono neg">${fmtMoney(-stats.maxDD)}</span></div>
          <div class="card-row"><span class="muted">Profit factor</span><span class="mono">${stats.profitFactor === Infinity ? '∞' : fmtNum(stats.profitFactor, 2)}</span></div>
          <div class="card-row"><span class="muted">Expectancy / trade</span><span class="mono ${stats.expectancy > 0 ? 'pos' : 'neg'}">${fmtMoney(stats.expectancy, { signed: true })}</span></div>
          <div class="card-row"><span class="muted">Avg R</span><span class="mono">${rValues.length ? fmtNum(rValues.reduce((a, b) => a + b, 0) / rValues.length, 2) + 'R' : '—'}</span></div>
          <div class="card-row"><span class="muted">Best trade</span><span class="mono pos">${stats.bestTrade ? fmtMoney(tradeNetPL(stats.bestTrade), { signed: true }) : '—'}</span></div>
          <div class="card-row"><span class="muted">Worst trade</span><span class="mono neg">${stats.worstTrade ? fmtMoney(tradeNetPL(stats.worstTrade), { signed: true }) : '—'}</span></div>
        </div>
      </div>
      ${mistakeFreq.length ? `
        <div class="card span-6">
          <h3 class="card-title">Mistake frequency</h3>
          ${barChart(mistakeFreq, { height: 240, fmt: v => v })}
        </div>
        <div class="card span-6">
          <h3 class="card-title">Cost of each mistake</h3>
          ${barChart(mistakeCostItems, { height: 240, fmt: v => fmtMoney(v, { decimals: 0 }) })}
        </div>` : ''}
    </div>
  `;
  mountView(html);
  document.querySelectorAll('[data-action="print"]').forEach(b => b.addEventListener('click', () => window.print()));
}

/* ============================================================
   WATCHLIST VIEW
   ============================================================ */
const watchlistState = { activeId: null };

function viewWatchlist() {
  const s = Store.get();
  if (!s.watchlists.length) {
    Store.set(st => st.watchlists.push({ id: uid(), name: 'Main', items: [] }));
  }
  if (!watchlistState.activeId || !s.watchlists.find(w => w.id === watchlistState.activeId)) {
    watchlistState.activeId = s.watchlists[0].id;
  }
  const active = s.watchlists.find(w => w.id === watchlistState.activeId);

  const html = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Watchlist</h1>
        <p class="page-subtitle">${active.items.length} ${active.items.length === 1 ? 'ticker' : 'tickers'}</p>
      </div>
      <div class="page-actions">
        <button class="btn" data-action="new-list">${ICONS.plus}<span>New list</span></button>
        <button class="btn btn-primary" data-action="add-ticker">${ICONS.plus}<span>Add ticker</span></button>
      </div>
    </div>

    <div class="tabs">
      ${s.watchlists.map(w => `
        <button class="tab ${w.id === watchlistState.activeId ? 'active' : ''}" data-wl="${w.id}">
          ${escapeHtml(w.name)}
        </button>`).join('')}
    </div>

    ${active.items.length === 0 ? `
      <div class="empty">
        <div class="empty-icon">${ICONS.watchlist}</div>
        <h3 class="empty-title">Empty watchlist</h3>
        <p class="empty-text">Track tickers you're considering, with target levels and catalysts.</p>
        <button class="btn btn-primary" data-action="add-ticker">${ICONS.plus}<span>Add a ticker</span></button>
      </div>
    ` : `
      <div class="table-wrap">
        <table class="table-mobile-cards">
          <thead><tr>
            <th>Ticker</th><th>Target entry</th><th>Target exit</th>
            <th>Catalyst</th><th>Event date</th><th>Notes</th><th></th>
          </tr></thead>
          <tbody>
            ${active.items.map((it, i) => `
              <tr>
                <td data-label="Ticker"><strong>${escapeHtml(it.ticker)}</strong></td>
                <td data-label="Entry" class="num">${it.targetEntry ? fmtMoney(it.targetEntry) : '—'}</td>
                <td data-label="Exit" class="num">${it.targetExit ? fmtMoney(it.targetExit) : '—'}</td>
                <td data-label="Catalyst">${escapeHtml(it.catalyst || '—')}</td>
                <td data-label="Date">${it.eventDate ? fmtDate(it.eventDate) : '—'}</td>
                <td data-label="Notes" class="muted">${escapeHtml(it.notes || '')}</td>
                <td data-label="" style="text-align:right;white-space:nowrap;">
                  <button class="btn btn-sm btn-ghost" data-convert="${i}" title="Convert to trade">${ICONS.plus}</button>
                  <button class="btn btn-sm btn-ghost" data-edit-wl="${i}">${ICONS.edit}</button>
                  <button class="btn btn-sm btn-ghost" data-del-wl="${i}">${ICONS.trash}</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    `}

    ${s.watchlists.length > 1 ? `<div style="margin-top:14px;"><button class="btn btn-sm btn-ghost" data-action="rename-list">Rename list</button> <button class="btn btn-sm btn-ghost" data-action="delete-list">${ICONS.trash}<span>Delete list</span></button></div>` : ''}
  `;
  mountView(html);

  document.querySelectorAll('[data-wl]').forEach(t => t.addEventListener('click', () => {
    watchlistState.activeId = t.dataset.wl; viewWatchlist();
  }));
  document.querySelectorAll('[data-action="new-list"]').forEach(b => b.addEventListener('click', () => {
    const name = prompt('Name this watchlist:');
    if (!name) return;
    const id = uid();
    Store.set(st => st.watchlists.push({ id, name: name.trim(), items: [] }));
    watchlistState.activeId = id;
    viewWatchlist();
  }));
  document.querySelectorAll('[data-action="add-ticker"]').forEach(b => b.addEventListener('click', () => openWatchlistItem()));
  document.querySelectorAll('[data-edit-wl]').forEach(b => b.addEventListener('click', () => openWatchlistItem(parseInt(b.dataset.editWl, 10))));
  document.querySelectorAll('[data-del-wl]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.dataset.delWl, 10);
    Store.set(st => {
      const w = st.watchlists.find(x => x.id === watchlistState.activeId);
      w.items.splice(i, 1);
    });
    viewWatchlist();
  }));
  document.querySelectorAll('[data-convert]').forEach(b => b.addEventListener('click', () => {
    const i = parseInt(b.dataset.convert, 10);
    const item = active.items[i];
    // Pre-fill trade form via a hidden draft
    openTradeFormFromWatchlist(item);
  }));
  const renameBtn = document.querySelector('[data-action="rename-list"]');
  if (renameBtn) renameBtn.addEventListener('click', () => {
    const name = prompt('Rename list:', active.name);
    if (!name) return;
    Store.set(st => { st.watchlists.find(w => w.id === active.id).name = name.trim(); });
    viewWatchlist();
  });
  const delBtn = document.querySelector('[data-action="delete-list"]');
  if (delBtn) delBtn.addEventListener('click', () => {
    confirmModal({
      title: 'Delete watchlist?', message: 'This list and its items will be removed.', confirmText: 'Delete', danger: true,
      onConfirm: () => {
        Store.set(st => { st.watchlists = st.watchlists.filter(w => w.id !== active.id); });
        watchlistState.activeId = null;
        viewWatchlist();
      }
    });
  });
}

function openWatchlistItem(index = null) {
  const s = Store.get();
  const wl = s.watchlists.find(w => w.id === watchlistState.activeId);
  const item = index != null ? wl.items[index] : { ticker: '', targetEntry: '', targetExit: '', catalyst: '', eventDate: '', notes: '' };
  const body = `
    <form id="wl-form">
      <div class="form-grid">
        <div class="field"><label>Ticker</label><input name="ticker" required value="${escapeHtml(item.ticker)}" style="text-transform:uppercase"/></div>
        <div class="field"><label>Catalyst</label><input name="catalyst" value="${escapeHtml(item.catalyst || '')}" placeholder="e.g. earnings, FDA decision"/></div>
        <div class="field"><label>Target entry</label><input type="number" step="any" min="0" name="targetEntry" value="${escapeHtml(item.targetEntry || '')}"/></div>
        <div class="field"><label>Target exit</label><input type="number" step="any" min="0" name="targetExit" value="${escapeHtml(item.targetExit || '')}"/></div>
        <div class="field"><label>Event date</label><input type="date" name="eventDate" value="${item.eventDate ? dayKey(item.eventDate) : ''}"/></div>
        <div class="field field-full"><label>Notes</label><textarea name="notes">${escapeHtml(item.notes || '')}</textarea></div>
      </div>
    </form>`;
  const footer = `<button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-save>Save</button>`;
  modal({
    title: index != null ? 'Edit ticker' : 'Add ticker', body, footer,
    onMount(overlay, close) {
      const form = overlay.querySelector('#wl-form');
      form.ticker.addEventListener('input', () => { form.ticker.value = form.ticker.value.toUpperCase(); });
      overlay.querySelector('[data-save]').addEventListener('click', () => {
        const tk = form.ticker.value.trim().toUpperCase();
        if (!tk) { form.ticker.classList.add('invalid'); return; }
        const newItem = {
          ticker: tk,
          targetEntry: form.targetEntry.value ? parseFloat(form.targetEntry.value) : null,
          targetExit: form.targetExit.value ? parseFloat(form.targetExit.value) : null,
          catalyst: form.catalyst.value.trim(),
          eventDate: form.eventDate.value || null,
          notes: form.notes.value.trim(),
        };
        Store.set(st => {
          const w = st.watchlists.find(x => x.id === watchlistState.activeId);
          if (index != null) w.items[index] = newItem; else w.items.push(newItem);
        });
        close(); viewWatchlist();
      });
    }
  });
}

function openTradeFormFromWatchlist(item) {
  // Open trade form, then pre-fill ticker + entry price after mount.
  openTradeForm();
  setTimeout(() => {
    const form = document.querySelector('#trade-form');
    if (!form) return;
    form.ticker.value = item.ticker;
    if (item.targetEntry) form.entryPrice.value = item.targetEntry;
    if (item.targetExit) form.takeProfit.value = item.targetExit;
    if (item.notes) form.preTradeNotes.value = item.notes;
  }, 50);
}

   JOURNAL VIEW
   ============================================================ */
const journalState = { mode: 'daily', date: dayKey(new Date()), search: '' };

function viewJournal() {
  const s = Store.get();
  const html = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Journal</h1>
        <p class="page-subtitle">Notes, weekly and monthly reviews</p>
      </div>
      <div class="page-actions">
        <input type="search" placeholder="Search journal…" data-jsearch value="${escapeHtml(journalState.search)}" style="width:220px;"/>
      </div>
    </div>

    <div class="tabs">
      <button class="tab ${journalState.mode === 'daily' ? 'active' : ''}" data-jmode="daily">Daily</button>
      <button class="tab ${journalState.mode === 'weekly' ? 'active' : ''}" data-jmode="weekly">Weekly review</button>
      <button class="tab ${journalState.mode === 'monthly' ? 'active' : ''}" data-jmode="monthly">Monthly review</button>
    </div>

    ${journalState.search ? renderJournalSearch() : (
      journalState.mode === 'daily' ? renderJournalDaily() :
      journalState.mode === 'weekly' ? renderJournalWeekly() :
      renderJournalMonthly()
    )}
  `;
  mountView(html);

  document.querySelectorAll('[data-jmode]').forEach(b => b.addEventListener('click', () => {
    journalState.mode = b.dataset.jmode; viewJournal();
  }));
  const search = document.querySelector('[data-jsearch]');
  if (search) search.addEventListener('input', debounce(e => { journalState.search = e.target.value; viewJournal(); }, 200));

  wireJournalEditors();
}

function renderJournalDaily() {
  const s = Store.get();
  const key = journalState.date;
  const text = s.journal.daily[key] || '';
  return `
    <div class="card">
      <div class="card-row" style="margin-bottom:12px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn btn-sm" data-jnav="-1">‹ Prev day</button>
          <input type="date" data-jdate value="${key}" style="width:auto;"/>
          <button class="btn btn-sm" data-jnav="1">Next day ›</button>
        </div>
        <div class="muted">${fmtDate(key)}</div>
      </div>
      <textarea data-jdaily style="min-height:280px;" placeholder="How did the day go? What did you notice in your behavior? What's the plan for tomorrow?">${escapeHtml(text)}</textarea>
      <div class="muted" style="font-size:11px;margin-top:8px;">Saves automatically.</div>
    </div>`;
}

function renderJournalWeekly() {
  const wk = weekKey(new Date(journalState.date));
  const s = Store.get();
  const data = s.journal.weekly[wk] || { worked: '', didntWork: '', lesson: '', adjustment: '' };
  return `
    <div class="card">
      <div class="card-row" style="margin-bottom:12px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn btn-sm" data-jnav="-7">‹ Prev week</button>
          <input type="date" data-jdate value="${journalState.date}" style="width:auto;"/>
          <button class="btn btn-sm" data-jnav="7">Next week ›</button>
        </div>
        <div class="muted">Week ${wk}</div>
      </div>
      <div class="form-grid">
        <div class="field field-full"><label>What worked?</label><textarea data-jweekly="worked">${escapeHtml(data.worked)}</textarea></div>
        <div class="field field-full"><label>What didn't?</label><textarea data-jweekly="didntWork">${escapeHtml(data.didntWork)}</textarea></div>
        <div class="field field-full"><label>Biggest lesson</label><textarea data-jweekly="lesson">${escapeHtml(data.lesson)}</textarea></div>
        <div class="field field-full"><label>Adjustment for next week</label><textarea data-jweekly="adjustment">${escapeHtml(data.adjustment)}</textarea></div>
      </div>
    </div>`;
}

function renderJournalMonthly() {
  const s = Store.get();
  const mk = monthKey(new Date(journalState.date));
  const data = s.journal.monthly[mk] || { reflection: '', goalForNext: '' };
  const month = new Date(journalState.date);
  const start = new Date(month.getFullYear(), month.getMonth(), 1);
  const end = new Date(month.getFullYear(), month.getMonth() + 1, 0);
  const closed = s.trades.filter(t => t.status === 'closed' && new Date(t.exitDate) >= start && new Date(t.exitDate) <= end);
  const pl = closed.reduce((a, t) => a + tradeNetPL(t), 0);
  const wins = closed.filter(t => tradeNetPL(t) > 0).length;
  const wr = closed.length ? (wins / closed.length) * 100 : 0;
  const best = closed.length ? closed.reduce((b, t) => tradeNetPL(t) > tradeNetPL(b) ? t : b) : null;
  const worst = closed.length ? closed.reduce((w, t) => tradeNetPL(t) < tradeNetPL(w) ? t : w) : null;
  const mistakes = {};
  closed.forEach(t => (t.mistakes || []).forEach(m => mistakes[m] = (mistakes[m] || 0) + 1));
  const topMistake = Object.entries(mistakes).sort((a, b) => b[1] - a[1])[0];

  return `
    <div class="card">
      <div class="card-row" style="margin-bottom:12px;">
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn btn-sm" data-jnav-month="-1">‹ Prev month</button>
          <input type="month" data-jmonth value="${mk}" style="width:auto;"/>
          <button class="btn btn-sm" data-jnav-month="1">Next month ›</button>
        </div>
        <div class="muted">${mk}</div>
      </div>
      <div class="grid grid-4" style="margin-bottom:18px;">
        <div class="stat"><span class="stat-label">Trades</span><span class="stat-value">${closed.length}</span></div>
        <div class="stat"><span class="stat-label">Win rate</span><span class="stat-value">${fmtPct(wr)}</span></div>
        <div class="stat"><span class="stat-label">P&amp;L</span><span class="stat-value ${pl > 0 ? 'pos' : pl < 0 ? 'neg' : ''}">${fmtMoney(pl, { signed: true })}</span></div>
        <div class="stat"><span class="stat-label">Top mistake</span><span class="stat-value" style="font-size:14px;">${topMistake ? escapeHtml(topMistake[0]) + ' ×' + topMistake[1] : '—'}</span></div>
      </div>
      <div class="grid grid-2" style="margin-bottom:14px;">
        <div class="card-row"><span class="muted">Best trade</span><span class="mono pos">${best ? best.ticker + ' ' + fmtMoney(tradeNetPL(best), { signed: true }) : '—'}</span></div>
        <div class="card-row"><span class="muted">Worst trade</span><span class="mono neg">${worst ? worst.ticker + ' ' + fmtMoney(tradeNetPL(worst), { signed: true }) : '—'}</span></div>
      </div>
      <div class="form-grid">
        <div class="field field-full"><label>Reflection</label><textarea data-jmonthly="reflection" style="min-height:120px;" placeholder="Looking at the numbers, what stands out?">${escapeHtml(data.reflection)}</textarea></div>
        <div class="field field-full"><label>Goal for next month</label><textarea data-jmonthly="goalForNext" style="min-height:80px;">${escapeHtml(data.goalForNext)}</textarea></div>
      </div>
    </div>`;
}

function renderJournalSearch() {
  const s = Store.get();
  const q = journalState.search.toLowerCase();
  const hits = [];
  Object.entries(s.journal.daily).forEach(([k, v]) => {
    if (v && v.toLowerCase().includes(q)) hits.push({ kind: 'daily', key: k, text: v });
  });
  Object.entries(s.journal.weekly).forEach(([k, v]) => {
    const blob = [v.worked, v.didntWork, v.lesson, v.adjustment].join(' ').toLowerCase();
    if (blob.includes(q)) hits.push({ kind: 'weekly', key: k, text: blob.slice(0, 200) });
  });
  Object.entries(s.journal.monthly).forEach(([k, v]) => {
    const blob = [v.reflection, v.goalForNext].join(' ').toLowerCase();
    if (blob.includes(q)) hits.push({ kind: 'monthly', key: k, text: blob.slice(0, 200) });
  });
  if (!hits.length) return `<div class="empty"><div class="empty-icon">${ICONS.search}</div><h3 class="empty-title">No matches</h3></div>`;
  return `
    <div class="card">
      <div class="muted" style="margin-bottom:10px;">${hits.length} ${hits.length === 1 ? 'result' : 'results'}</div>
      ${hits.map(h => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span class="tag">${h.kind}</span><span class="mono muted">${h.key}</span>
          </div>
          <div>${escapeHtml(h.text.slice(0, 240))}${h.text.length > 240 ? '…' : ''}</div>
        </div>`).join('')}
    </div>`;
}

function wireJournalEditors() {
  const navBtns = document.querySelectorAll('[data-jnav]');
  navBtns.forEach(b => b.addEventListener('click', () => {
    const d = new Date(journalState.date);
    d.setDate(d.getDate() + parseInt(b.dataset.jnav, 10));
    journalState.date = dayKey(d); viewJournal();
  }));
  const navMonth = document.querySelectorAll('[data-jnav-month]');
  navMonth.forEach(b => b.addEventListener('click', () => {
    const d = new Date(journalState.date);
    d.setMonth(d.getMonth() + parseInt(b.dataset.jnavMonth, 10));
    journalState.date = dayKey(d); viewJournal();
  }));
  const date = document.querySelector('[data-jdate]');
  if (date) date.addEventListener('change', () => { journalState.date = date.value; viewJournal(); });
  const mo = document.querySelector('[data-jmonth]');
  if (mo) mo.addEventListener('change', () => { journalState.date = mo.value + '-01'; viewJournal(); });

  const daily = document.querySelector('[data-jdaily]');
  if (daily) {
    const save = debounce(() => {
      Store.set(st => { st.journal.daily[journalState.date] = daily.value; });
    }, 400);
    daily.addEventListener('input', save);
  }
  document.querySelectorAll('[data-jweekly]').forEach(t => {
    const save = debounce(() => {
      const wk = weekKey(new Date(journalState.date));
      Store.set(st => {
        st.journal.weekly[wk] = st.journal.weekly[wk] || { worked: '', didntWork: '', lesson: '', adjustment: '' };
        st.journal.weekly[wk][t.dataset.jweekly] = t.value;
      });
    }, 400);
    t.addEventListener('input', save);
  });
  document.querySelectorAll('[data-jmonthly]').forEach(t => {
    const save = debounce(() => {
      const mk = monthKey(new Date(journalState.date));
      Store.set(st => {
        st.journal.monthly[mk] = st.journal.monthly[mk] || { reflection: '', goalForNext: '' };
        st.journal.monthly[mk][t.dataset.jmonthly] = t.value;
      });
    }, 400);
    t.addEventListener('input', save);
  });
}
