<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f8fa" />
<title>Trading Tracker</title>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<style>
/* ===========================================================
   THEME TOKENS
   =========================================================== */
:root {
  --bg: #0b0d12;
  --bg-elev: #11141b;
  --bg-elev-2: #161a23;
  --surface: #1a1f2a;
  --border: #232936;
  --border-strong: #2e3647;
  --text: #e7ebf2;
  --text-dim: #9aa3b2;
  --text-faint: #6b7280;
  --accent: #6366f1;
  --accent-hover: #7c7ff5;
  --accent-soft: rgba(99, 102, 241, 0.12);
  --pos: #22c55e;
  --pos-soft: rgba(34, 197, 94, 0.12);
  --neg: #ef4444;
  --neg-soft: rgba(239, 68, 68, 0.12);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.12);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 6px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.5);
  --radius: 10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --sidebar-w: 240px;
  --topbar-h: 60px;
  --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
[data-theme="light"] {
  --bg: #f7f8fa;
  --bg-elev: #ffffff;
  --bg-elev-2: #ffffff;
  --surface: #ffffff;
  --border: #e6e8ee;
  --border-strong: #d2d6df;
  --text: #0f172a;
  --text-dim: #5b6472;
  --text-faint: #8a93a3;
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-soft: rgba(79, 70, 229, 0.08);
  --pos: #16a34a;
  --pos-soft: rgba(22, 163, 74, 0.10);
  --neg: #dc2626;
  --neg-soft: rgba(220, 38, 38, 0.10);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, 0.10);
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
  --shadow-md: 0 6px 20px rgba(15,23,42,0.08);
  --shadow-lg: 0 18px 50px rgba(15,23,42,0.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.muted { color: var(--text-dim); }
.faint { color: var(--text-faint); }

/* ===========================================================
   LAYOUT
   =========================================================== */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas: "sidebar topbar" "sidebar main";
  height: 100vh;
  overflow: hidden;
}
.sidebar {
  grid-area: sidebar;
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  overflow-y: auto;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px 20px 10px;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.01em;
}
.brand-logo {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #8b5cf6);
  display: grid; place-items: center;
  color: white;
}
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-dim);
  text-decoration: none;
  font-size: 13.5px;
  transition: background 0.12s, color 0.12s;
}
.nav-item:hover { background: var(--bg-elev-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

.topbar {
  grid-area: topbar;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px;
}
.topbar-stats { display: flex; gap: 24px; align-items: center; }
.topbar-stat { display: flex; flex-direction: column; line-height: 1.2; }
.topbar-stat .label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }
.topbar-stat .value { font-family: var(--mono); font-weight: 600; font-size: 15px; }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.topbar-actions [data-action="mobile-settings"] { display: none; }

.main {
  grid-area: main;
  overflow-y: auto;
  padding: 24px;
}
.main-inner { max-width: 1400px; margin: 0 auto; }

.menu-toggle { display: none; background: transparent; border: none; color: var(--text); padding: 8px; }

/* ===========================================================
   BUTTONS
   =========================================================== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  transition: background 0.12s, border-color 0.12s, transform 0.05s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface); border-color: var(--border-strong); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: var(--neg); border-color: var(--neg); color: white; }
.btn-danger:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn-ghost:hover { background: var(--bg-elev-2); color: var(--text); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 7px; }

/* ===========================================================
   CARDS / SECTIONS
   =========================================================== */
.page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.page-subtitle { color: var(--text-dim); margin: 4px 0 0; font-size: 13.5px; }
.page-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.card-title { font-size: 13px; color: var(--text-dim); font-weight: 500; margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-12 { grid-template-columns: repeat(12, 1fr); }
.span-4 { grid-column: span 4; }
.span-6 { grid-column: span 6; }
.span-8 { grid-column: span 8; }
.span-12 { grid-column: span 12; }

.stat {
  display: flex; flex-direction: column; gap: 6px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
}
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); }
.stat-value { font-family: var(--mono); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; }
.stat-sub { font-size: 12px; color: var(--text-dim); font-family: var(--mono); }

/* ===========================================================
   TABLES
   =========================================================== */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  font-weight: 600;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elev);
  white-space: nowrap;
  cursor: default;
}
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--text); }
thead th .sort-arrow { display: inline-block; margin-left: 4px; opacity: 0.5; }
tbody td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--bg-elev-2); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  background: var(--bg-elev-2);
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; }
.pill-buy { background: var(--pos-soft); color: var(--pos); }
.pill-sell { background: var(--neg-soft); color: var(--neg); }
.pill-open { background: var(--accent-soft); color: var(--accent); }
.pill-closed { background: var(--bg-elev-2); color: var(--text-dim); }

/* ===========================================================
   FORMS
   =========================================================== */
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, 1fr); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-full { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--text-dim); font-weight: 500; }
.field .hint { font-size: 11px; color: var(--text-faint); }
.field .error { font-size: 11px; color: var(--neg); }
input[type="text"], input[type="number"], input[type="date"], input[type="datetime-local"], input[type="email"], select, textarea {
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  color: var(--text);
  font-size: 13.5px;
  width: 100%;
  transition: border-color 0.12s, background 0.12s;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
textarea { resize: vertical; min-height: 70px; }
input.invalid, select.invalid, textarea.invalid { border-color: var(--neg); }
input[type="range"] { padding: 0; width: 100%; }
input[type="file"] { padding: 6px; }
.range-wrap { display: flex; align-items: center; gap: 10px; }
.range-wrap .range-val { font-family: var(--mono); font-weight: 600; min-width: 24px; text-align: right; }

.checklist { display: flex; flex-direction: column; gap: 8px; }
.checklist-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
}
.checklist-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  font-size: 12px;
  cursor: pointer;
  user-select: none;
  transition: all 0.12s;
}
.chip:hover { border-color: var(--border-strong); }
.chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip-remove { color: var(--text-faint); margin-left: 2px; }

/* ===========================================================
   MODAL
   =========================================================== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: grid; place-items: center;
  z-index: 100; padding: 24px;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.15s ease-out;
}
.modal {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 640px;
  max-height: 90vh; overflow-y: auto;
  animation: slideUp 0.18s ease-out;
}
.modal-lg { max-width: 880px; }
.modal-sm { max-width: 440px; }
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg-elev); z-index: 1;
}
.modal-header h3 { margin: 0; font-size: 16px; font-weight: 600; }
.modal-body { padding: 22px; }
.modal-footer {
  padding: 16px 22px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
  position: sticky; bottom: 0; background: var(--bg-elev);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===========================================================
   TOAST
   =========================================================== */
.toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--bg-elev-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 12px 16px;
  box-shadow: var(--shadow-md);
  font-size: 13px;
  display: flex; align-items: center; gap: 10px;
  animation: slideIn 0.2s ease-out;
  max-width: 360px;
}
.toast-success { border-left: 3px solid var(--pos); }
.toast-error { border-left: 3px solid var(--neg); }
.toast-info { border-left: 3px solid var(--accent); }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* ===========================================================
   ONBOARDING
   =========================================================== */
.onboarding {
  position: fixed; inset: 0;
  background: var(--bg);
  display: grid; place-items: center;
  z-index: 50;
  padding: 24px;
  overflow-y: auto;
}
.onboarding-card {
  width: 100%; max-width: 520px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px;
  box-shadow: var(--shadow-lg);
}
.onboarding-step-indicator { display: flex; gap: 6px; margin-bottom: 24px; }
.onboarding-step-indicator > div { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
.onboarding-step-indicator > div.active { background: var(--accent); }
.onboarding h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.02em; }
.onboarding p { color: var(--text-dim); margin: 0 0 24px; font-size: 14px; }
.onboarding .privacy-points { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 26px; }
.onboarding .privacy-point { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.onboarding .privacy-point svg { width: 18px; height: 18px; color: var(--pos); flex-shrink: 0; margin-top: 1px; }

/* ===========================================================
   CHARTS
   =========================================================== */
.chart-wrap { position: relative; width: 100%; }
.chart-svg { display: block; width: 100%; height: auto; }
.chart-grid line { stroke: var(--border); stroke-dasharray: 2 4; }
.chart-axis text { fill: var(--text-faint); font-size: 10px; font-family: var(--mono); }
.chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart-area { fill: var(--accent-soft); }
.chart-bar { fill: var(--accent); }
.chart-bar-pos { fill: var(--pos); }
.chart-bar-neg { fill: var(--neg); }
.chart-tooltip {
  position: absolute;
  background: var(--bg-elev-2);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  font-family: var(--mono);
  pointer-events: none;
  box-shadow: var(--shadow-md);
  white-space: nowrap;
  display: none;
}
.donut-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; font-size: 12px; }
.donut-legend .item { display: flex; align-items: center; gap: 6px; }
.donut-legend .swatch { width: 10px; height: 10px; border-radius: 2px; }

.heatmap { display: grid; gap: 2px; font-size: 0; }
.heatmap-cell { aspect-ratio: 1; border-radius: 2px; }
.heatmap-cell.empty { background: var(--bg-elev-2); }

/* ===========================================================
   EMPTY STATE
   =========================================================== */
.empty {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-dim);
}
.empty-icon {
  width: 48px; height: 48px;
  margin: 0 auto 16px;
  color: var(--text-faint);
  background: var(--bg-elev-2);
  border-radius: 50%;
  display: grid; place-items: center;
}
.empty-title { font-size: 16px; color: var(--text); font-weight: 600; margin: 0 0 6px; }
.empty-text { font-size: 13.5px; margin: 0 0 18px; }

/* ===========================================================
   MISC
   =========================================================== */
.banner {
  background: var(--warn-soft);
  border: 1px solid var(--warn);
  color: var(--warn);
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.banner .banner-actions { margin-left: auto; display: flex; gap: 6px; }
.banner svg { width: 18px; height: 18px; flex-shrink: 0; }
.brand-logo svg { width: 16px; height: 16px; }
.empty-icon svg { width: 22px; height: 22px; }
.topbar-actions svg { width: 14px; height: 14px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab {
  padding: 10px 14px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filter-bar input, .filter-bar select { width: auto; min-width: 140px; padding: 7px 10px; font-size: 12.5px; }

.detail-grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
.detail-field { display: flex; flex-direction: column; gap: 2px; }
.detail-field .label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }
.detail-field .value { font-size: 14px; }
.detail-screenshot { max-width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-top: 12px; }

.keyhint {
  display: inline-block;
  padding: 1px 6px;
  font-family: var(--mono);
  font-size: 11px;
  background: var(--bg-elev-2);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--text-dim);
}

/* ===========================================================
   PWA — safe areas for iOS standalone mode (notch + home indicator)
   =========================================================== */
@supports (padding: max(0px)) {
  /* Push topbar content below the notch; extend the grid row to match. */
  .app { grid-template-rows: calc(var(--topbar-h) + env(safe-area-inset-top)) 1fr; }
  .topbar {
    padding-top: max(0px, env(safe-area-inset-top));
    height: calc(var(--topbar-h) + env(safe-area-inset-top));
  }
  .sidebar { padding-bottom: max(0px, env(safe-area-inset-bottom)); }
  .main { padding-bottom: max(0px, env(safe-area-inset-bottom)); }
  /* On mobile, the sidebar is the bottom tab bar — keep its content
     above the home indicator. */
  @media (max-width: 768px) {
    .app { grid-template-rows: calc(var(--topbar-h) + env(safe-area-inset-top)) 1fr calc(56px + env(safe-area-inset-bottom)); }
    .sidebar { padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
  }
}

/* ===========================================================
   RESPONSIVE
   =========================================================== */
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .span-4 { grid-column: span 6; }
  .span-6 { grid-column: span 12; }
  .span-8 { grid-column: span 12; }
}
@media (max-width: 768px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: var(--topbar-h) 1fr 56px;
    grid-template-areas: "topbar" "main" "sidebar";
  }
  .sidebar {
    border-right: none;
    border-top: 1px solid var(--border);
    flex-direction: row;
    padding: 4px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .brand, .nav-section { display: none; }
  .nav { flex-direction: row; gap: 2px; flex: 1; justify-content: space-around; }
  .nav-item {
    flex-direction: column;
    gap: 2px;
    padding: 6px 8px;
    font-size: 10px;
    min-width: 56px;
    text-align: center;
  }
  .nav-item svg { width: 18px; height: 18px; }
  /* Settings drops out of the bottom bar; it moves to the topbar instead. */
  .nav-item[data-nav="settings"] { display: none; }
  .topbar { padding: 0 12px; gap: 8px; }
  .topbar-stats { gap: 14px; }
  .topbar-stat .label { font-size: 10px; }
  .topbar-stat .value { font-size: 13px; }
  /* Compact "+" — drop the label, keep the icon. */
  .topbar-actions [data-action="new-trade"] span { display: none; }
  /* Mobile-only Settings gear in the topbar. */
  .topbar-actions [data-action="mobile-settings"] { display: inline-flex; }
  .main { padding: 14px; }
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .modal { max-height: 95vh; }
  .modal-header, .modal-body, .modal-footer { padding: 14px 16px; }
  /* Tables → cards on mobile */
  .table-mobile-cards thead { display: none; }
  .table-mobile-cards tbody, .table-mobile-cards tr, .table-mobile-cards td { display: block; width: 100%; }
  .table-mobile-cards tr {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    padding: 12px;
  }
  .table-mobile-cards td {
    border: none;
    padding: 4px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .table-mobile-cards td::before {
    content: attr(data-label);
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .table-mobile-cards td.num { text-align: right; }
}
@media (max-width: 480px) {
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
}

/* ===========================================================
   PRINT (monthly report)
   =========================================================== */
@media print {
  body { background: white; color: black; font-size: 11pt; }
  .sidebar, .topbar, .page-actions, .btn, .no-print { display: none !important; }
  .app { display: block; height: auto; overflow: visible; }
  .main { overflow: visible; padding: 0; }
  .card, .stat, .table-wrap { border: 1px solid #ccc; background: white; box-shadow: none; page-break-inside: avoid; }
  .pos { color: #166534; }
  .neg { color: #991b1b; }
  thead th { background: #f4f4f4; color: #333; }
  .heatmap-cell { border: 1px solid #ddd; }
}
</style>

  arrowUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',

function icon(name, extraClass = '') {
  return '<span class="ico ' + extraClass + '">' + (ICONS[name] || '') + '</span>';
}

/* ============================================================
   PWA — platform detection + install state.
   Lives here so it's available to renderShell() when the topbar
   decides whether to show the install button.
   ============================================================ */
const Platform = (() => {
  const ua = navigator.userAgent;
  const isIOS =
    /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  // iOS exposes Chrome/Firefox/Edge via their CriOS/FxiOS/EdgiOS UA tokens
  const isIOSNonSafari = isIOS && /CriOS|FxiOS|EdgiOS|OPiOS|mercury/i.test(ua);
  const isIOSSafari = isIOS && !isIOSNonSafari;
  const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  return { isIOS, isAndroid, isIOSSafari, isIOSNonSafari, isStandalone };
})();

// Stashed beforeinstallprompt event for Android / desktop Chrome / Edge.
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Re-render the shell so the install button picks up the new state.
  const btn = document.querySelector('[data-action="install-app"]');
  if (btn) btn.hidden = Platform.isStandalone;
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = document.querySelector('[data-action="install-app"]');
  if (btn) btn.hidden = true;
  toast('Installed. You can launch from your home screen.', 'success');
});

/* ============================================================
   STORE — single source of truth, persisted to localStorage.
   Screenshots are kept in IndexedDB because base64 images can
   blow past the localStorage quota.
   ============================================================ */
const STORE_KEY = 'tradingTracker.v1';
const STORE_VERSION = 1;

const DEFAULT_STATE = () => ({
  meta: {
    version: STORE_VERSION,
    createdAt: new Date().toISOString(),
    lastBackup: null,
    currency: 'USD',
    dateFormat: 'MM/DD/YYYY',
    decimals: 2,
    theme: 'light',
    onboarded: false,
    backupSnoozeUntil: null,
  },
  accounts: [],
  trades: [],
  watchlists: [{ id: uid(), name: 'Main', items: [] }],
  currentPrices: {},
  journal: { daily: {}, weekly: {}, monthly: {} },
  goals: { annualReturnPct: null, monthlyContribution: null, milestones: [] },
  customTags: {
    strategy: ['Swing', 'Day', 'Scalp', 'Position', 'DCA', 'Long-term'],
    setup: ['Breakout', 'Pullback', 'Reversal', 'News', 'Earnings', 'Other'],
    mistake: [
      'FOMO entry', 'No stop loss', 'Oversized position', 'Revenge trade',
      'Ignored thesis', 'Overtrading', 'Chased price', 'Exited too early',
      'Held too long', 'Averaged down on loser'
    ],
  },
  checklist: {
    items: [
      { id: uid(), text: 'Checked higher timeframe', enabled: true },
      { id: uid(), text: 'Risk is ≤ 2% of account', enabled: true },
      { id: uid(), text: 'Stop loss is set', enabled: true },
      { id: uid(), text: 'Market is liquid and open', enabled: true },
    ],
    required: false,
  },
});

const Store = (() => {
  let state = null;
  const subscribers = new Set();

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) { state = DEFAULT_STATE(); return; }
      const parsed = JSON.parse(raw);
      state = migrate(parsed);
    } catch (err) {
      console.error('Failed to load state', err);
      state = DEFAULT_STATE();
    }
  }

  function migrate(s) {
    // Forward-compat shell. v1 only: fill in any missing keys.
    const def = DEFAULT_STATE();
    return {
      meta: Object.assign({}, def.meta, s.meta || {}),
      accounts: s.accounts || [],
      trades: s.trades || [],
      watchlists: s.watchlists && s.watchlists.length ? s.watchlists : def.watchlists,
      currentPrices: s.currentPrices || {},
      journal: Object.assign({}, def.journal, s.journal || {}),
      goals: Object.assign({}, def.goals, s.goals || {}),
      customTags: Object.assign({}, def.customTags, s.customTags || {}),
      checklist: Object.assign({}, def.checklist, s.checklist || {}),
    };
  }

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (err) {
      console.error('Failed to persist', err);
      toast('Could not save — storage may be full', 'error');
    }
  }

  function get() { return state; }

  function set(updater) {
    if (typeof updater === 'function') updater(state);
    else state = updater;
    persist();
    subscribers.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });
  }

  function subscribe(fn) { subscribers.add(fn); return () => subscribers.delete(fn); }

  function exportJSON() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'trading-tracker-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    set(s => { s.meta.lastBackup = new Date().toISOString(); });
  }

  function importJSON(json) {
    try {
      const parsed = typeof json === 'string' ? JSON.parse(json) : json;
      state = migrate(parsed);
      persist();
      subscribers.forEach(fn => fn(state));
      return true;
    } catch (err) {
      console.error(err);
      return false;
    }
  }

  function reset() {
    state = DEFAULT_STATE();
    state.meta.onboarded = true; // user already used the app
    persist();
    Screenshots.clearAll();
    subscribers.forEach(fn => fn(state));
  }

  return { load, get, set, subscribe, exportJSON, importJSON, reset };
})();

/* ============================================================
   SCREENSHOTS — IndexedDB store for trade screenshots.
   ============================================================ */
const Screenshots = (() => {
  const DB_NAME = 'tradingTracker';
  const STORE = 'screenshots';
  let dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }

  async function put(id, dataUrl) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(dataUrl, id);
      tx.oncomplete = () => resolve(id);
      tx.onerror = () => reject(tx.error);
    });
  }
  async function get(id) {
    if (!id) return null;
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function remove(id) {
    if (!id) return;
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function clearAll() {
    try {
      const db = await open();
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).clear();
    } catch (e) { /* ignore */ }
  }
  return { put, get, remove, clearAll };
})();

/* ============================================================
   HELPERS
   ============================================================ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

const CURRENCIES = {
  USD: { symbol: '$',  code: 'USD' },
  EUR: { symbol: '€',  code: 'EUR' },
  GBP: { symbol: '£',  code: 'GBP' },
  PKR: { symbol: '₨',  code: 'PKR' },
  INR: { symbol: '₹',  code: 'INR' },
  JPY: { symbol: '¥',  code: 'JPY' },
  CAD: { symbol: 'C$', code: 'CAD' },
  AUD: { symbol: 'A$', code: 'AUD' },
};

function fmtMoney(n, opts = {}) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const meta = Store.get().meta;
  const sym = (CURRENCIES[meta.currency] || CURRENCIES.USD).symbol;
  const dec = opts.decimals != null ? opts.decimals : meta.decimals;
  const sign = n < 0 ? '-' : (opts.signed && n > 0 ? '+' : '');
  const abs = Math.abs(n);
  return sign + sym + abs.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtNum(n, dec = 2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtPct(n, opts = {}) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const dec = opts.decimals != null ? opts.decimals : 2;
  const sign = n < 0 ? '-' : (opts.signed && n > 0 ? '+' : '');
  return sign + Math.abs(n).toFixed(dec) + '%';
}
function fmtDate(d, withTime = false) {
  if (!d) return '—';
  const date = d instanceof Date ? d : new Date(d);
  if (isNaN(date.getTime())) return '—';
  const meta = Store.get().meta;
  const yyyy = date.getFullYear();
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  let out;
  if (meta.dateFormat === 'DD/MM/YYYY') out = dd + '/' + mm + '/' + yyyy;
  else if (meta.dateFormat === 'YYYY-MM-DD') out = yyyy + '-' + mm + '-' + dd;
  else out = mm + '/' + dd + '/' + yyyy;
  if (withTime) {
    const hh = String(date.getHours()).padStart(2, '0');
    const mn = String(date.getMinutes()).padStart(2, '0');
    out += ' ' + hh + ':' + mn;
  }
  return out;
}
function localDateInput(d) {
  // formats Date as YYYY-MM-DDTHH:MM for <input type="datetime-local">
  const date = d instanceof Date ? d : new Date(d);
  const tzOffset = date.getTimezoneOffset() * 60000;
  return new Date(date - tzOffset).toISOString().slice(0, 16);
}
function dayKey(d) {
  const date = d instanceof Date ? d : new Date(d);
  return date.toISOString().slice(0, 10);
}
function monthKey(d) {
  const date = d instanceof Date ? d : new Date(d);
  return date.toISOString().slice(0, 7);
}
function weekKey(d) {
  // ISO week (rough): YYYY-WW
  const date = new Date(Date.UTC(d.getFullYear ? d.getFullYear() : new Date(d).getFullYear(),
                                  d.getMonth ? d.getMonth() : new Date(d).getMonth(),
                                  d.getDate ? d.getDate() : new Date(d).getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  return date.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
}
function durationHuman(ms) {
  if (!ms || ms < 0) return '—';
  const m = Math.floor(ms / 60000);
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  const d = Math.floor(h / 24);
  if (d < 30) return d + 'd ' + (h % 24) + 'h';
  return Math.floor(d / 30) + 'mo ' + (d % 30) + 'd';
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }

/* ============================================================
   TRADE MATH
   ============================================================ */
function tradeFees(t) { return (Number(t.entryFees) || 0) + (Number(t.exitFees) || 0); }
function tradeGrossPL(t) {
  if (t.status !== 'closed') return 0;
  const dir = (t.side === 'Buy' || t.side === 'Cover') ? 1 : -1;
  return dir * (Number(t.exitPrice) - Number(t.entryPrice)) * Number(t.quantity);
}
function tradeNetPL(t) { return tradeGrossPL(t) - tradeFees(t); }
function tradePLPct(t) {
  if (t.status !== 'closed') return 0;
  const cost = Number(t.entryPrice) * Number(t.quantity);
  if (!cost) return 0;
  return (tradeNetPL(t) / cost) * 100;
}
function tradeRiskPerShare(t) {
  if (!t.stopLoss) return null;
  return Math.abs(Number(t.entryPrice) - Number(t.stopLoss));
}
function tradeInitialRisk(t) {
  const rps = tradeRiskPerShare(t);
  if (rps == null) return null;
  return rps * Number(t.quantity);
}
function tradeRR(t) {
  // planned risk/reward at entry
  if (!t.stopLoss || !t.takeProfit) return null;
  const risk = Math.abs(Number(t.entryPrice) - Number(t.stopLoss));
  const reward = Math.abs(Number(t.takeProfit) - Number(t.entryPrice));
  if (!risk) return null;
  return reward / risk;
}
function tradeRMultiple(t) {
  if (t.status !== 'closed') return null;
  const risk = tradeInitialRisk(t);
  if (!risk) return null;
  return tradeNetPL(t) / risk;
}
function tradeHoldMs(t) {
  if (!t.entryDate) return 0;
  const end = t.status === 'closed' && t.exitDate ? new Date(t.exitDate) : new Date();
  return end - new Date(t.entryDate);
}
function tradeCurrentValue(t, priceOverride) {
  const price = priceOverride != null ? priceOverride : (Store.get().currentPrices[t.ticker]?.price);
  if (price == null) return null;
  return Number(price) * Number(t.quantity);
}
function tradeUnrealized(t) {
  const price = Store.get().currentPrices[t.ticker]?.price;
  if (price == null) return null;
  const dir = (t.side === 'Buy' || t.side === 'Cover') ? 1 : -1;
  return dir * (Number(price) - Number(t.entryPrice)) * Number(t.quantity) - (Number(t.entryFees) || 0);
}

/* ============================================================
   PORTFOLIO METRICS
   ============================================================ */
function getStats() {
  const s = Store.get();
  const closed = s.trades.filter(t => t.status === 'closed');
  const open = s.trades.filter(t => t.status === 'open');

  const wins = closed.filter(t => tradeNetPL(t) > 0);
  const losses = closed.filter(t => tradeNetPL(t) < 0);
  const winRate = closed.length ? (wins.length / closed.length) * 100 : 0;
  const grossWin = wins.reduce((a, t) => a + tradeNetPL(t), 0);
  const grossLoss = Math.abs(losses.reduce((a, t) => a + tradeNetPL(t), 0));
  const profitFactor = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);

  const totalRealized = closed.reduce((a, t) => a + tradeNetPL(t), 0);
  const startingCapital = s.accounts.reduce((a, acc) => a + (Number(acc.startingCapital) || 0), 0);

  // Cost basis of currently-open positions
  const openCost = open.reduce((a, t) => a + Number(t.entryPrice) * Number(t.quantity) + (Number(t.entryFees) || 0), 0);
  // Current market value of open positions (uses manual prices when known)
  const openValue = open.reduce((a, t) => {
    const v = tradeCurrentValue(t);
    return a + (v != null ? v : Number(t.entryPrice) * Number(t.quantity));
  }, 0);
  const openUnrealized = open.reduce((a, t) => {
    const u = tradeUnrealized(t);
    return a + (u != null ? u : 0);
  }, 0);

  const cash = startingCapital + totalRealized - openCost;
  const portfolioValue = cash + openValue;
  const allTimePL = portfolioValue - startingCapital;
  const allTimePLPct = startingCapital > 0 ? (allTimePL / startingCapital) * 100 : 0;

  // Today's P&L
  const todayKey = dayKey(new Date());
  const todayClosed = closed.filter(t => dayKey(t.exitDate) === todayKey);
  const todayPL = todayClosed.reduce((a, t) => a + tradeNetPL(t), 0);
  const todayPLPct = portfolioValue > 0 ? (todayPL / portfolioValue) * 100 : 0;

  // Best / worst
  const bestTrade = closed.length ? closed.reduce((b, t) => tradeNetPL(t) > tradeNetPL(b) ? t : b) : null;
  const worstTrade = closed.length ? closed.reduce((w, t) => tradeNetPL(t) < tradeNetPL(w) ? t : w) : null;

  // Streaks (chronological by exitDate)
  const sortedClosed = [...closed].sort((a, b) => new Date(a.exitDate) - new Date(b.exitDate));
  let currentStreak = 0; let currentStreakKind = null;
  let longestWin = 0; let runWin = 0;
  for (const t of sortedClosed) {
    const pl = tradeNetPL(t);
    if (pl > 0) {
      runWin++; longestWin = Math.max(longestWin, runWin);
      currentStreak = currentStreakKind === 'win' ? currentStreak + 1 : 1;
      currentStreakKind = 'win';
    } else if (pl < 0) {
      runWin = 0;
      currentStreak = currentStreakKind === 'loss' ? currentStreak + 1 : 1;
      currentStreakKind = 'loss';
    }
  }

  // Drawdown from equity curve
  const eq = equityCurve();
  let peak = -Infinity, maxDD = 0;
  for (const p of eq) {
    if (p.value > peak) peak = p.value;
    const dd = peak - p.value;
    if (dd > maxDD) maxDD = dd;
  }

  const avgWin = wins.length ? grossWin / wins.length : 0;
  const avgLoss = losses.length ? grossLoss / losses.length : 0;
  const expectancy = closed.length ? totalRealized / closed.length : 0;

  return {
    portfolioValue, allTimePL, allTimePLPct, todayPL, todayPLPct,
    cash, openValue, openUnrealized, openCost, startingCapital,
    winRate, profitFactor, totalRealized,
    wins: wins.length, losses: losses.length, total: closed.length,
    bestTrade, worstTrade, longestWin, currentStreak, currentStreakKind,
    maxDD, avgWin, avgLoss, expectancy,
  };
}

function equityCurve() {
  // cumulative realized P&L by exitDate
  const s = Store.get();
  const closed = s.trades
    .filter(t => t.status === 'closed')
    .sort((a, b) => new Date(a.exitDate) - new Date(b.exitDate));
  const startingCapital = s.accounts.reduce((a, acc) => a + (Number(acc.startingCapital) || 0), 0);
  let cum = startingCapital;
  const points = [{ date: s.meta.createdAt, value: cum }];
  for (const t of closed) {
    cum += tradeNetPL(t);
    points.push({ date: t.exitDate, value: cum });
  }
  return points;
}

/* ============================================================
   ROUTER — hash-based, supports #/route and #/route/param.
   ============================================================ */
const Router = (() => {
  let current = '#/dashboard';
  const handlers = {};
  function on(route, fn) { handlers[route] = fn; }
  function nav(to) {
    if (location.hash !== to) location.hash = to;
    else handle();
  }
  function handle() {
    const hash = location.hash || '#/dashboard';
    current = hash;
    const parts = hash.replace(/^#\//, '').split('/');
    const base = parts[0] || 'dashboard';
    const fn = handlers[base] || handlers.dashboard;
    if (fn) fn(parts.slice(1));
  }
  function init() {
    window.addEventListener('hashchange', handle);
    handle();
  }
  function getCurrent() { return current; }
  return { on, nav, init, getCurrent };
})();

/* ============================================================
   TOAST + MODAL + CONFIRM
   ============================================================ */
function toast(msg, kind = 'info', timeout = 3200) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast toast-' + kind;
  el.innerHTML = escapeHtml(msg);
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; el.style.transition = 'opacity 0.2s, transform 0.2s'; }, timeout - 200);
  setTimeout(() => el.remove(), timeout);
}

function modal({ title, body, footer, size = '', onMount, onClose }) {
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal ${size}">
      <div class="modal-header">
        <h3>${escapeHtml(title || '')}</h3>
        <button class="btn btn-ghost btn-icon" data-close aria-label="Close">${ICONS.close}</button>
      </div>
      <div class="modal-body">${body || ''}</div>
      ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
    </div>`;
  function close() { overlay.remove(); if (onClose) onClose(); }
  overlay.addEventListener('click', e => {
    if (e.target === overlay || e.target.closest('[data-close]')) close();
  });
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
  root.appendChild(overlay);
  if (onMount) onMount(overlay, close);
  return { close, el: overlay };
}

function confirmModal({ title = 'Are you sure?', message = '', confirmText = 'Confirm', danger = false, onConfirm }) {
  modal({
    title,
    size: 'modal-sm',
    body: `<p style="margin:0; color:var(--text-dim);">${escapeHtml(message)}</p>`,
    footer: `
      <button class="btn" data-close>Cancel</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-confirm>${escapeHtml(confirmText)}</button>`,
    onMount(overlay, close) {
      overlay.querySelector('[data-confirm]').addEventListener('click', () => { close(); onConfirm && onConfirm(); });
    }
  });
}

/* ============================================================
   THEME — resolves "system" via prefers-color-scheme and keeps the
   <html data-theme> attribute in sync. The OS media query is only
   listened to while the user has explicitly chosen "system".
   ============================================================ */
const systemThemeMQ = window.matchMedia('(prefers-color-scheme: dark)');
function resolveTheme() {
  const t = Store.get().meta.theme;
  if (t === 'system') return systemThemeMQ.matches ? 'dark' : 'light';
  return t === 'dark' ? 'dark' : 'light';
}
function applyTheme() {
  document.documentElement.setAttribute('data-theme', resolveTheme());
}
function onSystemThemeChange() {
  if (Store.get().meta.theme === 'system') applyTheme();
}
// Subscribe once. Safari < 14 lacks addEventListener on MediaQueryList; the
// addListener fallback covers it.
if (systemThemeMQ.addEventListener) systemThemeMQ.addEventListener('change', onSystemThemeChange);
else if (systemThemeMQ.addListener) systemThemeMQ.addListener(onSystemThemeChange);

function backupBanner() {
  const s = Store.get();
  if (!s.meta.onboarded) return '';
  const snoozeUntil = s.meta.backupSnoozeUntil ? new Date(s.meta.backupSnoozeUntil) : null;
  if (snoozeUntil && snoozeUntil > new Date()) return '';
  const last = s.meta.lastBackup ? new Date(s.meta.lastBackup) : null;
  const daysSince = last ? (Date.now() - last.getTime()) / (1000 * 60 * 60 * 24) : Infinity;
  if (daysSince < 30) return '';
  return `
    <div class="banner" id="backup-banner">
      ${ICONS.shield}
      <span>It's been ${last ? Math.floor(daysSince) + ' days' : 'a while'} since your last backup. Your data lives only on this device.</span>
      <div class="banner-actions">
        <button class="btn btn-sm" data-banner="backup-now">Back up now</button>
        <button class="btn btn-sm btn-ghost" data-banner="snooze">Remind me later</button>
      </div>
    </div>`;
}
function wireBackupBanner(scope = document) {
  const banner = scope.querySelector('#backup-banner');

  banner.querySelector('[data-banner="backup-now"]').addEventListener('click', () => {

  });
}

/* ============================================================
   CHARTS — pure SVG. Each chart returns an HTML string.
   ============================================================ */
const CHART_COLORS = ['#6366f1', '#22c55e', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6', '#ef4444', '#10b981', '#f97316'];

function lineChart(points, opts = {}) {
  // points: [{x, y, label?}]
  const W = opts.width || 800;
  const H = opts.height || 240;
  const pad = { t: 16, r: 16, b: 28, l: 56 };
  if (!points.length) return emptyChart(W, H, 'No data yet');
  const xs = points.map(p => +new Date(p.x));
  const ys = points.map(p => p.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const yPad = (yMax - yMin) * 0.1 || Math.abs(yMax) * 0.1 || 1;
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const sx = x => pad.l + ((x - xMin) / (xMax - xMin || 1)) * (W - pad.l - pad.r);
  const sy = y => H - pad.b - ((y - yLo) / (yHi - yLo || 1)) * (H - pad.t - pad.b);
  const path = points.map((p, i) => (i ? 'L' : 'M') + sx(+new Date(p.x)) + ',' + sy(p.y)).join(' ');
  const area = path + ` L${sx(xMax)},${H - pad.b} L${sx(xMin)},${H - pad.b} Z`;

  const yTicks = 4;
  const gridLines = Array.from({ length: yTicks + 1 }, (_, i) => {
    const v = yLo + ((yHi - yLo) * i) / yTicks;
    const y = sy(v);
    return `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}"/>
            <text x="${pad.l - 8}" y="${y + 4}" text-anchor="end">${fmtMoney(v, { decimals: 0 })}</text>`;
  }).join('');
  const xTicks = 5;
  const xLabels = Array.from({ length: xTicks + 1 }, (_, i) => {
    const v = xMin + ((xMax - xMin) * i) / xTicks;
    return `<text x="${sx(v)}" y="${H - pad.b + 16}" text-anchor="middle">${fmtDate(new Date(v))}</text>`;
  }).join('');

  return `
    <div class="chart-wrap">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        <g class="chart-grid">${gridLines}</g>
        <g class="chart-axis">${xLabels}</g>
        <path d="${area}" class="chart-area"/>
        <path d="${path}" class="chart-line"/>
      </svg>
    </div>`;
}

function emptyChart(W, H, msg) {
  return `<div class="chart-wrap" style="display:grid;place-items:center;height:${H}px;color:var(--text-faint);font-size:13px;">${escapeHtml(msg)}</div>`;
}

function barChart(items, opts = {}) {
  // items: [{label, value, color?}]
  const W = opts.width || 600;
  const H = opts.height || 240;
  const pad = { t: 16, r: 16, b: 50, l: 50 };
  if (!items.length) return emptyChart(W, H, 'No data');
  const max = Math.max(...items.map(i => Math.abs(i.value))) || 1;
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;
  const barW = innerW / items.length;

  const hasNeg = items.some(i => i.value < 0);
  const baseY = hasNeg ? pad.t + innerH / 2 : H - pad.b;
  const scale = hasNeg ? innerH / 2 / max : innerH / max;

  const bars = items.map((item, i) => {
    const x = pad.l + i * barW + barW * 0.15;
    const w = barW * 0.7;
    const h = Math.abs(item.value) * scale;
    const y = item.value >= 0 ? baseY - h : baseY;
    const color = item.color || (item.value >= 0 ? 'var(--pos)' : 'var(--neg)');
    return `
      <g>
        <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" rx="3"/>
        <text x="${x + w / 2}" y="${H - pad.b + 16}" text-anchor="middle" fill="var(--text-faint)" font-size="10">${escapeHtml(item.label)}</text>
        <text x="${x + w / 2}" y="${y - 5}" text-anchor="middle" fill="var(--text-dim)" font-size="10" font-family="var(--mono)">${opts.fmt ? opts.fmt(item.value) : fmtNum(item.value, 0)}</text>
      </g>`;
  }).join('');

  const axisLine = `<line x1="${pad.l}" y1="${baseY}" x2="${W - pad.r}" y2="${baseY}" stroke="var(--border)"/>`;

  return `
    <div class="chart-wrap">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        ${axisLine}
        ${bars}
      </svg>
    </div>`;
}

function donutChart(items, opts = {}) {
  // items: [{label, value}]
  const W = opts.size || 220;
  const H = W;
  const cx = W / 2, cy = H / 2;
  const r = W * 0.4;
  const ir = r * 0.6;
  const total = items.reduce((a, i) => a + Math.abs(i.value), 0);
  if (!total) return emptyChart(W, H, 'No data');
  let angle = -Math.PI / 2;
  const arcs = items.map((item, i) => {
    const slice = (Math.abs(item.value) / total) * Math.PI * 2;
    const a1 = angle, a2 = angle + slice;
    angle = a2;
    const large = slice > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
    const xi1 = cx + ir * Math.cos(a1), yi1 = cy + ir * Math.sin(a1);
    const xi2 = cx + ir * Math.cos(a2), yi2 = cy + ir * Math.sin(a2);
    const path = `M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} L${xi2},${yi2} A${ir},${ir} 0 ${large} 0 ${xi1},${yi1} Z`;
    const color = CHART_COLORS[i % CHART_COLORS.length];
    return `<path d="${path}" fill="${color}"/>`;
  }).join('');
  const center = opts.centerLabel ? `
    <text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="var(--text-faint)" font-size="10">${escapeHtml(opts.centerLabel)}</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="600" font-family="var(--mono)">${escapeHtml(opts.centerValue || '')}</text>` : '';
  const legend = items.map((item, i) => `
    <div class="item">
      <span class="swatch" style="background:${CHART_COLORS[i % CHART_COLORS.length]}"></span>
      <span>${escapeHtml(item.label)}</span>
      <span class="mono muted">${((Math.abs(item.value) / total) * 100).toFixed(1)}%</span>
    </div>`).join('');
  return `
    <div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap; justify-content:center;">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
        ${arcs}
        ${center}
      </svg>
      <div class="donut-legend" style="flex:1; min-width:160px; flex-direction:column;">${legend}</div>
    </div>`;
}

function heatmapCalendar(dailyPL, opts = {}) {
  // dailyPL: { 'YYYY-MM-DD': value }
  const today = new Date();
  const months = 12;
  const start = new Date(today.getFullYear(), today.getMonth() - months + 1, 1);
  // Build a grid of cells
  const days = [];
  const cursor = new Date(start);
  // backfill to Sunday
  while (cursor.getDay() !== 0) cursor.setDate(cursor.getDate() - 1);
  const end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  // forward to Saturday
  while (end.getDay() !== 6) end.setDate(end.getDate() + 1);
  while (cursor <= end) {
    days.push(new Date(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }
  const maxAbs = Math.max(1, ...Object.values(dailyPL).map(v => Math.abs(v)));
  const cells = days.map(d => {
    const k = dayKey(d);
    const v = dailyPL[k];
    let bg = 'var(--bg-elev-2)';
    if (v !== undefined && v !== 0) {
      const intensity = Math.min(1, Math.abs(v) / maxAbs);
      const a = 0.25 + intensity * 0.75;
      bg = v > 0 ? `rgba(34,197,94,${a})` : `rgba(239,68,68,${a})`;
    }
    const inRange = d >= start && d <= new Date(today.getFullYear(), today.getMonth() + 1, 0);
    const op = inRange ? 1 : 0.2;
    const title = v !== undefined ? `${fmtDate(d)}: ${fmtMoney(v, { signed: true })}` : fmtDate(d);
    return `<div class="heatmap-cell" style="background:${bg}; opacity:${op};" title="${escapeHtml(title)}"></div>`;
  }).join('');
  const cols = Math.ceil(days.length / 7);
  return `
    <div class="heatmap" style="grid-template-columns: repeat(${cols}, minmax(0,1fr)); grid-auto-flow: column; grid-template-rows: repeat(7, 1fr);">
      ${cells}
    </div>`;
}

function histogramChart(values, opts = {}) {
  const W = opts.width || 600;
  const H = opts.height || 220;
  const pad = { t: 16, r: 16, b: 40, l: 40 };
  if (!values.length) return emptyChart(W, H, 'No data');
  // Bucket by R-multiple: -3, -2, -1, 0, 1, 2, 3+
  const buckets = { '<-3R': 0, '-3R': 0, '-2R': 0, '-1R': 0, '0R': 0, '+1R': 0, '+2R': 0, '+3R': 0, '>+3R': 0 };
  values.forEach(r => {
    if (r < -3) buckets['<-3R']++;
    else if (r < -2) buckets['-3R']++;
    else if (r < -1) buckets['-2R']++;
    else if (r < 0) buckets['-1R']++;
    else if (r < 1) buckets['0R']++;
    else if (r < 2) buckets['+1R']++;
    else if (r < 3) buckets['+2R']++;
    else if (r <= 3) buckets['+3R']++;
    else buckets['>+3R']++;
  });
  const items = Object.entries(buckets).map(([k, v]) => ({
    label: k, value: v,
    color: k.startsWith('+') || k.startsWith('>+') ? 'var(--pos)' : (k.startsWith('-') || k.startsWith('<-') ? 'var(--neg)' : 'var(--text-faint)'),
  }));
  return barChart(items, { width: W, height: H, fmt: v => v });
}

/* ============================================================
   ONBOARDING — multi-step intro shown until meta.onboarded
   ============================================================ */
function renderOnboarding() {
  const root = document.getElementById('app');
  let step = 1;
  let currency = 'USD';
  let firstAccount = { name: '', type: 'Broker', startingCapital: '' };

  function draw() {
    root.innerHTML = `
      <div class="onboarding">
        <div class="onboarding-card">
          <div class="onboarding-step-indicator">
            <div class="${step >= 1 ? 'active' : ''}"></div>
            <div class="${step >= 2 ? 'active' : ''}"></div>
            <div class="${step >= 3 ? 'active' : ''}"></div>
          </div>
          ${step === 1 ? stepWelcome() : step === 2 ? stepCurrency() : stepAccount()}
        </div>
      </div>`;
    wire();
  }

  function stepWelcome() {
    return `
      <h1>Your trades, on your machine.</h1>
      <p>A trading journal and portfolio tracker designed for privacy. No cloud, no account, no tracking — your data lives only in this browser.</p>
      <div class="privacy-points">
        <div class="privacy-point">${ICONS.check}<span>All data is stored locally on this device. We can't see it.</span></div>
        <div class="privacy-point">${ICONS.check}<span>Works offline. No internet required after this first open.</span></div>
        <div class="privacy-point">${ICONS.check}<span>Export a full backup any time. You own your data.</span></div>
        <div class="privacy-point">${ICONS.check}<span>No analytics, no telemetry, no third-party scripts.</span></div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn btn-ghost" data-action="skip">Skip setup</button>
        <button class="btn btn-primary" data-action="next">Get started</button>
      </div>`;
  }
  function stepCurrency() {
    return `
      <h1>Pick your currency.</h1>
      <p>Used everywhere money is shown. You can change this later in Settings.</p>
      <div class="field" style="margin-bottom: 26px;">
        <label>Currency</label>
        <select data-currency>
          ${Object.entries(CURRENCIES).map(([k, v]) => `<option value="${k}" ${k === currency ? 'selected' : ''}>${k} — ${v.symbol}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex; justify-content:space-between; gap:8px;">
        <button class="btn" data-action="back">Back</button>
        <button class="btn btn-primary" data-action="next">Continue</button>
      </div>`;
  }
  function stepAccount() {
    return `
      <h1>Add your first account.</h1>
      <p>An account is a place where your money lives — a broker, an exchange, a wallet. You can add more later.</p>
      <div class="form-grid">
        <div class="field field-full">
          <label>Account name</label>
          <input type="text" data-name placeholder="e.g. Interactive Brokers" value="${escapeHtml(firstAccount.name)}"/>
        </div>
        <div class="field">
          <label>Type</label>
          <select data-type>
            <option ${firstAccount.type === 'Broker' ? 'selected' : ''}>Broker</option>
            <option ${firstAccount.type === 'Crypto Exchange' ? 'selected' : ''}>Crypto Exchange</option>
            <option ${firstAccount.type === 'Wallet' ? 'selected' : ''}>Wallet</option>
            <option ${firstAccount.type === 'Bank' ? 'selected' : ''}>Bank</option>
          </select>
        </div>
        <div class="field">
          <label>Starting capital</label>
          <input type="number" data-capital placeholder="0" step="0.01" value="${escapeHtml(firstAccount.startingCapital)}"/>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; gap:8px; margin-top:22px;">
        <button class="btn" data-action="back">Back</button>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" data-action="skip">Skip for now</button>
          <button class="btn btn-primary" data-action="finish">Finish</button>
        </div>
      </div>`;
  }

  function wire() {
    root.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const a = btn.dataset.action;
        if (a === 'next') {
          if (step === 2) { currency = root.querySelector('[data-currency]').value; }
          step++; draw();
        } else if (a === 'back') { step--; draw(); }
        else if (a === 'skip') { finish(true); }
        else if (a === 'finish') {
          const name = root.querySelector('[data-name]').value.trim();
          const cap = parseFloat(root.querySelector('[data-capital]').value) || 0;
          const type = root.querySelector('[data-type]').value;
          if (name) {
            firstAccount = { name, type, startingCapital: cap };
            finish(false);
          } else {
            finish(true);
          }
        }
      });
    });
  }

  function finish(skipAccount) {
    Store.set(s => {
      s.meta.onboarded = true;
      s.meta.currency = currency;
      if (!skipAccount && firstAccount.name) {
        s.accounts.push({
          id: uid(),
          name: firstAccount.name,
          type: firstAccount.type,
          startingCapital: firstAccount.startingCapital,
          defaultFeeType: 'flat',
          defaultFeeValue: 0,
          notes: '',
          createdAt: new Date().toISOString(),
        });
      }
    });
    // Install routing + shortcuts now that the user is past onboarding.
    // Set the hash first so Router.init's initial handle() lands on the right view.
    location.hash = '#/dashboard';
    Router.init();
    bindShortcuts();
    maybeShowIOSChromeBanner();
  }

  draw();
}

   ============================================================ */
function viewDashboard() {
  const s = Store.get();
  const stats = getStats();
  const closed = s.trades.filter(t => t.status === 'closed').sort((a, b) => new Date(b.exitDate) - new Date(a.exitDate));
  const recent = [...s.trades].sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt)).slice(0, 10);

  // Asset allocation donut by asset type (uses cost basis of open positions)
  const allocItems = (() => {
    const byType = {};
    s.trades.filter(t => t.status === 'open').forEach(t => {
      const v = tradeCurrentValue(t) ?? Number(t.entryPrice) * Number(t.quantity);
      byType[t.assetType] = (byType[t.assetType] || 0) + v;
    });
    if (stats.cash > 0) byType['Cash'] = stats.cash;
    return Object.entries(byType).map(([label, value]) => ({ label, value }));
  })();

  const allTimeClass = stats.allTimePL > 0 ? 'pos' : (stats.allTimePL < 0 ? 'neg' : '');
  const todayClass = stats.todayPL > 0 ? 'pos' : (stats.todayPL < 0 ? 'neg' : '');

  // Goals
  const goalCards = (() => {
    const g = s.goals;
    if (!g.annualReturnPct && !g.monthlyContribution && !(g.milestones && g.milestones.length)) return '';
    const startYear = new Date().getFullYear();
    const ytdClosed = closed.filter(t => new Date(t.exitDate).getFullYear() === startYear);
    const ytdPL = ytdClosed.reduce((a, t) => a + tradeNetPL(t), 0);
    const ytdPct = stats.startingCapital > 0 ? (ytdPL / stats.startingCapital) * 100 : 0;
    let html = '<div class="card" style="margin-top:16px"><h3 class="card-title">Goals</h3><div class="grid grid-3" style="gap:12px;">';
    if (g.annualReturnPct) {
      const pct = clamp((ytdPct / g.annualReturnPct) * 100, 0, 100);
      html += `<div>
        <div class="muted" style="font-size:12px;">Annual return target</div>
        <div class="mono" style="font-weight:600">${fmtPct(ytdPct, { signed: true })} / ${fmtPct(g.annualReturnPct)}</div>
        <div style="height:6px;background:var(--bg-elev-2);border-radius:3px;margin-top:6px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px;"></div>
        </div></div>`;
    }
    (g.milestones || []).forEach(m => {
      const pct = clamp((stats.portfolioValue / m.value) * 100, 0, 100);
      html += `<div>
        <div class="muted" style="font-size:12px;">${escapeHtml(m.label || 'Milestone')}</div>
        <div class="mono" style="font-weight:600">${fmtMoney(stats.portfolioValue)} / ${fmtMoney(m.value)}</div>
        <div style="height:6px;background:var(--bg-elev-2);border-radius:3px;margin-top:6px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px;"></div>
        </div></div>`;
    });
    html += '</div></div>';
    return html;
  })();

  const html = `
    ${backupBanner()}
    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard</h1>
        <p class="page-subtitle">${s.accounts.length} ${s.accounts.length === 1 ? 'account' : 'accounts'} · ${s.trades.length} trades</p>
      </div>
      <div class="page-actions">
        <button class="btn" data-action="update-prices">${ICONS.refresh}<span>Update prices</span></button>
        <button class="btn btn-primary" data-action="new-trade-dash">${ICONS.plus}<span>New trade</span></button>
      </div>
    </div>

    <div class="grid grid-4">
      <div class="stat">
        <span class="stat-label">Portfolio value</span>
        <span class="stat-value">${fmtMoney(stats.portfolioValue)}</span>
        <span class="stat-sub ${todayClass}">${fmtMoney(stats.todayPL, { signed: true })} today (${fmtPct(stats.todayPLPct, { signed: true })})</span>
      </div>
      <div class="stat">
        <span class="stat-label">All-time P&amp;L</span>
        <span class="stat-value ${allTimeClass}">${fmtMoney(stats.allTimePL, { signed: true })}</span>
        <span class="stat-sub ${allTimeClass}">${fmtPct(stats.allTimePLPct, { signed: true })}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Win rate</span>
        <span class="stat-value">${fmtPct(stats.winRate)}</span>
        <span class="stat-sub">${stats.wins} wins · ${stats.losses} losses</span>
      </div>
      <div class="stat">
        <span class="stat-label">Profit factor</span>
        <span class="stat-value">${stats.profitFactor === Infinity ? '∞' : fmtNum(stats.profitFactor, 2)}</span>
        <span class="stat-sub">Expectancy ${fmtMoney(stats.expectancy)}</span>
      </div>
    </div>

    <div class="grid grid-12" style="margin-top:16px;">
      <div class="card span-8">
        <h3 class="card-title">Equity curve</h3>
        ${lineChart(equityCurve().map(p => ({ x: p.date, y: p.value })), { height: 260 })}
      </div>
      <div class="card span-4">
        <h3 class="card-title">Allocation</h3>
        ${donutChart(allocItems, { size: 200, centerLabel: 'Total', centerValue: fmtMoney(stats.portfolioValue, { decimals: 0 }) })}
      </div>
    </div>

    ${goalCards}

    <div class="grid grid-12" style="margin-top:16px;">
      <div class="card span-8">
        <h3 class="card-title">Recent trades</h3>
        ${recent.length === 0 ? `
          <div class="empty">
            <div class="empty-icon">${ICONS.trades}</div>
            <h3 class="empty-title">No trades yet</h3>
            <p class="empty-text">Log your first trade to start tracking your performance.</p>
            <button class="btn btn-primary" data-action="new-trade-dash">${ICONS.plus}<span>Add a trade</span></button>
          </div>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <div class="card-row"><span class="muted">Best trade</span><span class="mono pos">${stats.bestTrade ? fmtMoney(tradeNetPL(stats.bestTrade), { signed: true }) : '—'}</span></div>
          <div class="card-row"><span class="muted">Worst trade</span><span class="mono neg">${stats.worstTrade ? fmtMoney(tradeNetPL(stats.worstTrade), { signed: true }) : '—'}</span></div>
          <div class="card-row"><span class="muted">Avg win</span><span class="mono pos">${fmtMoney(stats.avgWin)}</span></div>
          <div class="card-row"><span class="muted">Avg loss</span><span class="mono neg">${fmtMoney(-stats.avgLoss)}</span></div>
          <div class="card-row"><span class="muted">Longest win streak</span><span class="mono">${stats.longestWin}</span></div>
          <div class="card-row"><span class="muted">Current streak</span><span class="mono">${stats.currentStreak} ${stats.currentStreakKind ? (stats.currentStreakKind === 'win' ? 'W' : 'L') : ''}</span></div>
          <div class="card-row"><span class="muted">Max drawdown</span><span class="mono neg">${fmtMoney(-stats.maxDD)}</span></div>
          <div class="card-row"><span class="muted">Cash</span><span class="mono">${fmtMoney(stats.cash)}</span></div>
        </div>
      </div>
    </div>
  `;

  mountView(html);
  wireBackupBanner();
  document.querySelectorAll('[data-action="new-trade-dash"]').forEach(b => b.addEventListener('click', openTradeForm));
